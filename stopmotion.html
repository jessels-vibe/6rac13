<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stop Motion — 6rac13</title>
  <link rel="icon" href="assets/g-logo.png">
  <style>
    @font-face {
      font-family: 'Amoresa Aged';
      src: url('assets/fonts/AmorosaAged.otf') format('opentype');
      font-weight: normal; font-style: normal;
    }
    @font-face {
      font-family: 'Coco Gothic';
      src: url('assets/fonts/CocoGothic.ttf') format('truetype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Coco Gothic';
      src: url('assets/fonts/CocoGothic-Bold.ttf') format('truetype');
      font-weight: 700;
    }
    @font-face {
      font-family: 'Coco Gothic';
      src: url('assets/fonts/CocoGothic-Light.ttf') format('truetype');
      font-weight: 300;
    }
    :root {
      --blue:   #1C1CCC;
      --yellow: #F2C800;
      --dark:   #28283A;
      --red:    #CC1818;
      --cream:  #F0E4C4;
      --nav-h:  80px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--blue);
      color: var(--yellow);
      font-family: 'Coco Gothic', sans-serif;
      min-height: 100vh;
    }

    /* ── NAV ─────────────────────────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0; z-index: 200;
      height: var(--nav-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px;
      background: transparent;
      transition: background 0.4s, box-shadow 0.3s;
    }
    nav.scrolled {
      background: var(--blue);
      box-shadow: 0 1px 0 rgba(242,200,0,0.12);
    }
    .nav-logo { display: flex; align-items: center; text-decoration: none; }
    .nav-logo img { height: 62px; width: auto; object-fit: contain; display: block; }
    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a {
      color: var(--yellow); text-decoration: none;
      font-family: 'Coco Gothic', sans-serif; font-weight: 700;
      font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .nav-links a:hover { opacity: 0.6; }
    .nav-links a.active { border-bottom: 1px solid var(--yellow); }
    .nav-dropdown-wrap { position: relative; }
    .dropdown-toggle { cursor: pointer; background: none; border: none; padding: 0; }
    .nav-dropdown {
      position: absolute; top: calc(100% + 12px); left: -16px;
      background: var(--blue); border: 1px solid rgba(242,200,0,0.25);
      min-width: 160px; display: none; flex-direction: column; z-index: 300;
    }
    .nav-dropdown-wrap.open .nav-dropdown { display: flex; }
    .nav-dropdown a {
      padding: 12px 20px; color: rgba(242,200,0,0.75); text-decoration: none;
      font-family: 'Coco Gothic', sans-serif; font-weight: 600; font-size: 11px;
      letter-spacing: 0.14em; text-transform: uppercase; transition: color 0.15s;
      border-left: 2px solid transparent;
    }
    .nav-dropdown a:hover { color: var(--yellow); border-left-color: var(--yellow); background: rgba(242,200,0,0.04); }
    .nav-dropdown a.active-sm { color: var(--yellow); border-left-color: var(--yellow); }

    /* ── HERO ────────────────────────────────────────────────────────── */
    .sm-hero {
      position: relative;
      height: 100vh;
      overflow: hidden;
      background: var(--blue);
    }

    .sm-title {
      font-family: 'Amoresa Aged', cursive;
      font-size: clamp(72px, 12vw, 180px);
      color: var(--yellow);
      position: absolute;
      top: 10%;
      left: 17%;
      right: 2%;
      line-height: 0.88;
      z-index: 5;
      pointer-events: none;
    }

    .sm-char {
      position: absolute;
      object-fit: contain;
    }

    #sm-red-fig        { left: 1%;   bottom: 0;    height: 87vh; z-index: 8; }
    #sm-blue-fig       { right: 1%;  bottom: 0;    height: 84vh; z-index: 8; }
    #sm-rabbit         { left: 16%;  bottom: 10%;  height: 36vh; z-index: 6; }
    #sm-flytrap        { left: 31%;  bottom: 1%;   height: 46vh; z-index: 6; }
    #sm-two-head-worm  { left: 47%;  top: 17%;     height: 13vh; z-index: 6; }
    #sm-millipede      { left: 50%;  top: 34%;     height: 22vh; z-index: 6; }
    #sm-mama-bird      { left: 58%;  bottom: 22%;  height: 21vh; z-index: 6; }
    #sm-metal-fly      { left: 70%;  top: 11%;     height: 19vh; z-index: 6; }
    #sm-snake          { left: 63%;  top: 53%;     height: 15vh; z-index: 6; }
    #sm-worm           { left: 44%;  top: 52%;     height: 11vh; z-index: 6; }

    /* ── POSTCARD FOOTER ─────────────────────────────────────────────── */
    .postcard-footer { margin: 0 28px 40px; }
    .pc-wrap { position: relative; }
    .pc-bg { width: 100%; display: block; }
    .pc-form {
      position: absolute;
      left: 10%; right: 10.5%;
      top: 14%; bottom: 15%;
      display: flex;
      pointer-events: none;
    }
    .pc-form * { pointer-events: all; }
    .pc-msg {
      flex: 1;
      background: transparent;
      border: none;
      resize: none;
      font-family: 'Coco Gothic', sans-serif;
      font-weight: 300;
      font-size: clamp(15px, 1.8vw, 23px);
      color: #1C1CCC;
      outline: none;
      padding: 45% 4% 4% 4%;
      line-height: 2;
    }
    .pc-msg::placeholder { color: rgba(28,28,204,0.35); }
    .pc-addr {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 40% 4% 4% 6%;
    }
    .pc-to {
      font-family: 'Coco Gothic', sans-serif;
      font-weight: 700;
      font-size: clamp(12px, 1.5vw, 20px);
      color: #1C1CCC;
      letter-spacing: 0.04em;
      padding-bottom: 5%;
      border-bottom: 1px solid rgba(120,100,70,0.4);
    }
    .pc-row {
      display: flex;
      align-items: center;
      padding: 3.5% 0 1.5%;
      border-bottom: 1px solid rgba(120,100,70,0.25);
      gap: 4px;
    }
    .pc-lbl {
      font-family: 'Coco Gothic', sans-serif;
      font-weight: 700;
      font-size: clamp(11px, 1.3vw, 17px);
      color: rgba(28,28,204,0.7);
      white-space: nowrap;
    }
    .pc-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #1C1CCC;
      font-family: 'Coco Gothic', sans-serif;
      font-weight: 300;
      font-size: clamp(12px, 1.4vw, 18px);
      outline: none;
      min-width: 0;
    }
    .pc-input::placeholder { color: rgba(28,28,204,0.3); }
    .pc-send {
      margin-top: 6%;
      align-self: flex-end;
      background: none;
      border: 1px solid rgba(120,100,70,0.5);
      color: #1C1CCC;
      font-family: 'Coco Gothic', sans-serif;
      font-weight: 700;
      font-size: clamp(11px, 1.2vw, 15px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .pc-send:hover { background: rgba(120,100,70,0.12); }
    .pc-send:disabled { opacity: 0.4; cursor: not-allowed; }
    .pc-sent {
      position: absolute;
      left: 10%; right: 10%;
      top: 40%;
      text-align: center;
      font-family: 'Coco Gothic', sans-serif;
      font-weight: 300;
      font-size: clamp(15px, 1.8vw, 23px);
      color: #1C1CCC;
      letter-spacing: 0.08em;
    }

    /* ── MOBILE ──────────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      .nav-links { gap: 20px; }
      .nav-links a { font-size: 11px; }
      .sm-title { font-size: clamp(52px, 11vw, 100px); left: 14%; top: 8%; }
      #sm-red-fig  { height: 72vh; }
      #sm-blue-fig { height: 68vh; }
      #sm-rabbit   { height: 28vh; }
      #sm-flytrap  { height: 36vh; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav id="mainNav">
    <a href="index.html" class="nav-logo">
      <img src="assets/g-logo.png" alt="6rac13">
    </a>
    <ul class="nav-links">
      <li><a href="work.html?filter=art">Art</a></li>
      <li><a href="work.html?filter=portraits">Portraits</a></li>
      <li><a href="work.html?filter=videoart">Video Art</a></li>
      <li><a href="stopmotion.html" class="active">Stop Motion</a></li>
      <li><a href="work.html?filter=events">Events</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <!-- HERO -->
  <section class="sm-hero">
    <h1 class="sm-title">Stop Motion</h1>
    <img class="sm-char" id="sm-red-fig"       src="assets/red-fig.png"       alt="">
    <img class="sm-char" id="sm-blue-fig"      src="assets/blue-fig.png"      alt="">
    <img class="sm-char" id="sm-rabbit"        src="assets/rabbit.png"        alt="">
    <img class="sm-char" id="sm-flytrap"       src="assets/venus-flytrap.png" alt="">
    <img class="sm-char" id="sm-two-head-worm" src="assets/two-head-worm.png" alt="">
    <img class="sm-char" id="sm-millipede"     src="assets/millipede.png"     alt="">
    <img class="sm-char" id="sm-mama-bird"     src="assets/mama-bird.png"     alt="">
    <img class="sm-char" id="sm-metal-fly"     src="assets/metal-fly.png"     alt="">
    <img class="sm-char" id="sm-snake"         src="assets/snake.png"         alt="">
    <img class="sm-char" id="sm-worm"          src="assets/worm.png"          alt="">
  </section>

  <!-- POSTCARD FOOTER -->
  <footer class="postcard-footer">
    <div class="pc-wrap">
      <img src="assets/postcard.png" class="pc-bg" alt="">
      <form class="pc-form" id="pcForm" action="https://formspree.io/f/mwlpabqv" method="POST">
        <textarea class="pc-msg" name="message" placeholder="Write your message to Gracie…"></textarea>
        <div class="pc-addr">
          <div class="pc-to">To: Gracie F. Vanderlaan</div>
          <div class="pc-row">
            <span class="pc-lbl">From:</span>
            <input class="pc-input" type="text" name="name" placeholder="Your name">
          </div>
          <div class="pc-row">
            <input class="pc-input" type="email" name="email" placeholder="your@email.com">
          </div>
          <div class="pc-row">
            <span class="pc-lbl">Subject:</span>
            <input class="pc-input" type="text" name="subject" placeholder="What's this about?">
          </div>
          <button class="pc-send" type="submit">Send →</button>
        </div>
      </form>
      <div class="pc-sent" id="pcSent" style="display:none">Message sent — Gracie will be in touch.</div>
    </div>
  </footer>

  <script>
    window.addEventListener('scroll', () => {
      document.getElementById('mainNav').classList.toggle('scrolled', window.scrollY > 10);
    });
    const workWrap = document.getElementById('workDropWrap');
    document.getElementById('workToggle').addEventListener('click', e => { e.preventDefault(); workWrap.classList.toggle('open'); });
    document.addEventListener('click', e => { if (!workWrap.contains(e.target)) workWrap.classList.remove('open'); });

    const pcForm = document.getElementById('pcForm');
    if (pcForm) {
      pcForm.addEventListener('submit', async e => {
        e.preventDefault();
        const btn = pcForm.querySelector('.pc-send');
        btn.disabled = true; btn.textContent = 'Sending…';
        try {
          const res = await fetch(pcForm.action, { method: 'POST', body: new FormData(pcForm), headers: { 'Accept': 'application/json' } });
          if (res.ok) { pcForm.style.display = 'none'; document.getElementById('pcSent').style.display = 'block'; }
          else { btn.disabled = false; btn.textContent = 'Try Again →'; }
        } catch { btn.disabled = false; btn.textContent = 'Try Again →'; }
      });
    }
  </script>
</body>
</html>
