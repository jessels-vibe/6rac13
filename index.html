<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>6rac13</title>
  <link rel="icon" href="assets/g-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Amoresa Aged';
      src: url('assets/fonts/AmorosaAged.otf') format('opentype');
      font-weight: normal; font-style: normal;
    }
    :root {
      --blue:   #1800AD;
      --yellow: #FFEF5E;
      --dark:   #28283A;
      --red:    #CC1818;
      --cream:  #F0E4C4;
      --nav-h:  80px;
    }
    html { scrollbar-gutter: stable; }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--blue); color: var(--yellow); font-family: 'Jost', sans-serif; }

    /* ── VIEWS ───────────────────────────────────────────────────────── */
    .view { display: none; }
    .view.active { display: block; }

    /* ── NAV ─────────────────────────────────────────────────────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      height: var(--nav-h); display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; background: var(--blue); transition: box-shadow 0.3s;
    }
    nav.scrolled { box-shadow: 0 1px 0 rgba(255,239,94,0.12); }
    .nav-logo { display: flex; align-items: center; text-decoration: none; }
    .nav-logo img { height: 62px; width: auto; object-fit: contain; display: block; }
    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a {
      color: var(--yellow); text-decoration: none; font-family: 'Jost', sans-serif;
      font-weight: 700; font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; transition: opacity 0.2s;
    }
    .nav-links a:hover { opacity: 0.6; }
    .nav-links a.active { border-bottom: 1px solid var(--yellow); }
    .nav-dropdown-wrap { position: relative; }
    .dropdown-toggle {
      cursor: pointer; background: none; border: none; padding: 0;
      color: var(--yellow); font-family: 'Jost', sans-serif; font-weight: 700;
      font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; transition: opacity 0.2s;
    }
    .dropdown-toggle:hover { opacity: 0.6; }
    .dropdown-toggle.active { border-bottom: 1px solid var(--yellow); }
    .nav-dropdown {
      position: absolute; top: calc(100% + 12px); left: -16px;
      background: var(--blue); border: 1px solid rgba(255,239,94,0.25);
      min-width: 160px; display: none; flex-direction: column; z-index: 300;
    }
    .nav-dropdown-wrap.open .nav-dropdown { display: flex; }
    .nav-dropdown a {
      padding: 12px 20px; color: rgba(255,239,94,0.75); text-decoration: none;
      font-family: 'Jost', sans-serif; font-weight: 600; font-size: 11px;
      letter-spacing: 0.14em; text-transform: uppercase; transition: color 0.15s;
      border-left: 2px solid transparent;
    }
    .nav-dropdown a:hover,
    .nav-dropdown a.active-filter { color: var(--yellow); border-left-color: var(--yellow); background: rgba(255,239,94,0.04); }


    /* ── HOME VIEW ───────────────────────────────────────────────────── */
    .home-hero { height: 100vh; padding-top: var(--nav-h); position: relative; overflow: hidden; }
    .hero-card-wrap { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -56%); z-index: 10; }
    .hero-card-wrap img { width: clamp(300px, 52vw, 740px); display: block; filter: drop-shadow(0 24px 64px rgba(0,0,0,0.65)); }
    .c-blue-fig { position: absolute; left: 14%; bottom: 18%; width: clamp(150px, 19vw, 290px); z-index: 20; }
    .c-red-fig  { position: absolute; right: 14%; bottom: 18%; width: clamp(150px, 19vw, 290px); z-index: 20; }
    .c-blue-fig img, .c-red-fig img { width: 100%; height: auto; display: block; }
    .hero-ctas {
      position: absolute; bottom: 4%; left: 0; right: 0;
      display: flex; justify-content: space-around; padding: 0 8%; z-index: 20;
    }
    .hero-cta-link {
      font-family: 'Amoresa Aged', cursive; font-size: clamp(68px, 11vw, 160px);
      color: var(--yellow); text-decoration: none; line-height: 0.85; transition: opacity 0.2s;
    }
    .hero-cta-link:hover { opacity: 0.72; }
    .works-section { padding: 80px 28px 0; }
    .works-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
    .view-all-wrap { padding: 40px 28px; }
    .view-all {
      font-family: 'Jost', sans-serif; font-weight: 700; font-size: 12px;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--yellow);
      text-decoration: none; border-bottom: 1px solid var(--yellow); padding-bottom: 2px; transition: opacity 0.2s;
    }
    .view-all:hover { opacity: 0.6; }
    .contact-strip {
      margin: 0 28px; border-top: 1px solid rgba(255,239,94,0.2);
      padding: 40px 0 0;
    }
    .contact-strip h2 { font-family: 'Amoresa Aged', cursive; font-size: clamp(48px, 7vw, 88px); color: var(--yellow); line-height: 0.9; }

    /* ── WORK VIEW ───────────────────────────────────────────────────── */
    .page-header { padding: calc(var(--nav-h) + 20px) 28px 0; display: flex; flex-direction: column; justify-content: flex-start; }
    .header-title {
      font-family: 'Amoresa Aged', cursive; font-size: clamp(72px, 13vw, 160px);
      color: var(--yellow); line-height: 0.85; margin-bottom: 32px;
      transition: opacity 0.3s; text-align: right; padding-top: 52px;
    }
    .header-title.fading { opacity: 0; }
    .video-art-hero { position: relative; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .vah-bg { position: absolute; inset: 0; }
    .vah-bg video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .vah-title {
      position: relative; z-index: 2;
      font-family: 'Amoresa Aged', cursive;
      font-size: clamp(80px, 18vw, 320px);
      color: var(--yellow);
      text-align: center;
      line-height: 0.9;
      pointer-events: none;
      padding: 0 16px;
    }
    .grid-wrap { padding: 3px; }
    .work-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }

    /* shared tile styles */
    .work-tile {
      position: relative; overflow: hidden; cursor: pointer;
      background: rgba(255,255,255,0.04); aspect-ratio: 1/1; text-decoration: none; transition: opacity 0.4s;
    }
    .tile-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s; }
    .work-tile:hover .tile-img { transform: scale(1.05); }
    .tile-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(24,0,173,0.92) 0%, transparent 55%);
      opacity: 0; transition: opacity 0.3s; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px;
    }
    .work-tile:hover .tile-overlay { opacity: 1; }
    .tile-title { font-family: 'Amoresa Aged', cursive; font-size: 28px; color: var(--yellow); line-height: 1; }
    .skeleton { background: rgba(255,255,255,0.06); animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.06; } 50% { opacity: 0.13; } }
    .works-empty { display: none; grid-column: 1/-1; text-align: center; padding: 100px 20px; color: rgba(255,239,94,0.35); font-size: 14px; letter-spacing: 0.08em; }

    /* ── INLINE EXPAND ───────────────────────────────────────────────── */
    .expand-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.4s ease-out;
      overflow: hidden;
    }
    .expand-row.open { grid-template-rows: 1fr; }
    .expand-inner { min-height: 0; overflow: hidden; }
    .expand-panel {
      background: var(--blue);
      padding: 0 0 48px;
      position: relative;
    }
    .expand-close {
      position: absolute; top: 16px; right: 20px; z-index: 10;
      background: none; border: 1px solid rgba(255,239,94,0.35);
      color: var(--yellow); width: 36px; height: 36px;
      cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .expand-close:hover { background: rgba(255,239,94,0.1); }
    .expand-hero {
      width: 100%;
      background: var(--blue);
      overflow: hidden;
      display: block;
    }
    .expand-hero img,
    .expand-hero video {
      width: 100%; height: auto;
      max-height: 90vh; object-fit: contain; display: block;
    }
    .expand-body { padding: 56px 28px 0; max-width: 900px; }
    .expand-title { font-family: 'Amoresa Aged', cursive; font-size: clamp(48px, 8vw, 100px); color: var(--yellow); line-height: 0.9; margin-bottom: 20px; }
    .expand-desc { font-family: 'Jost', sans-serif; font-weight: 300; font-size: 15px; line-height: 1.8; color: rgba(255,255,255,0.72); max-width: 640px; }
    .expand-bts { padding: 28px 28px 0; }
    .expand-bts-label { font-family: 'Jost', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,239,94,0.4); border-top: 1px solid rgba(255,239,94,0.12); padding-top: 28px; margin-bottom: 16px; }
    .expand-bts-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
    .expand-bts-link-grid { display: flex; flex-direction: column; gap: 20px; margin-top: 16px; }
    .bts-embed { width: 100%; }
    .bts-embed-wrap { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #000; }
    .bts-embed-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .bts-embed-label { font-family: 'Jost', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,239,94,0.5); margin-top: 6px; }
    .bts-link-card {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.06); padding: 24px 16px; gap: 10px;
      text-decoration: none; color: var(--yellow); transition: background 0.2s; cursor: pointer;
      border: 1px solid rgba(255,239,94,0.1);
    }
    .bts-link-card:hover { background: rgba(255,255,255,0.1); }
    .bts-link-icon { font-size: 28px; line-height: 1; }
    .bts-link-label { font-family: 'Jost', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; text-align: center; }

    /* tile image protection overlay */
    .tile-protect {
      position: absolute; inset: 0; z-index: 5;
      cursor: pointer;
      -webkit-touch-callout: none;
    }

    /* ── STOP MOTION VIEW ────────────────────────────────────────────── */
    .sm-hero { position: relative; height: 100vh; overflow: hidden; background: var(--blue); }
    .sm-title {
      font-family: 'Amoresa Aged', cursive; font-size: clamp(72px, 12vw, 180px);
      color: var(--yellow); position: absolute;
      top: calc(var(--nav-h) + 80px); left: 17%; right: 2%;
      line-height: 1; z-index: 5; pointer-events: none;
    }
    .sm-char { position: absolute; object-fit: contain; -webkit-user-drag: none; user-select: none; -webkit-touch-callout: none; }
    #sm-red-fig        { left: 1%;   bottom: 0;    height: 87vh; z-index: 8; }
    #sm-blue-fig       { right: 1%;  bottom: 0;    height: 84vh; z-index: 8; }
    #sm-rabbit         { left: 22%;  bottom: 8%;   height: 42vh; z-index: 6; }
    #sm-flytrap        { left: 35%;  bottom: 0;    height: 52vh; z-index: 6; }
    #sm-two-head-worm  { left: 51%;  top: 38%;     height: 12vh; z-index: 6; }
    #sm-millipede      { left: 55%;  top: 50%;     height: 20vh; z-index: 6; }
    #sm-mama-bird      { left: 58%;  bottom: 20%;  height: 20vh; z-index: 6; }
    #sm-metal-fly      { left: 68%;  top: 20%;     height: 18vh; z-index: 6; }
    #sm-snake          { right: 18%; top: 55%;     height: 15vh; z-index: 6; }
    #sm-worm           { left: 48%;  top: 50%;     height: 10vh; z-index: 6; }
    .sm-projects { background: var(--blue); padding: 48px 28px 0; }

    /* ── PROJECT VIEW (legacy — kept for direct URL fallback) ────────── */
    .project-hero { width: 100%; height: 75vh; min-height: 400px; position: relative; overflow: hidden; background: var(--dark); }
    .hero-img, .hero-video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-skeleton { width: 100%; height: 100%; background: rgba(255,255,255,0.06); animation: pulse 1.4s ease-in-out infinite; }
    .project-body { display: grid; grid-template-columns: 1fr; padding: 48px 28px; align-items: start; max-width: 900px; }
    .proj-title { font-family: 'Amoresa Aged', cursive; font-size: clamp(52px, 9vw, 112px); color: var(--yellow); line-height: 0.9; margin-bottom: 28px; }
    .proj-desc { font-family: 'Jost', sans-serif; font-weight: 300; font-size: 15px; line-height: 1.8; color: rgba(255,255,255,0.72); max-width: 640px; }
    .next-project-bar { border-top: 1px solid rgba(255,239,94,0.15); padding: 40px 28px 0; }
    .next-project-link { display: inline-flex; align-items: baseline; gap: 16px; text-decoration: none; color: var(--yellow); transition: opacity 0.2s; }
    .next-project-link:hover { opacity: 0.65; }
    .np-label { font-family: 'Jost', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,239,94,0.45); }
    .np-title { font-family: 'Amoresa Aged', cursive; font-size: clamp(32px, 5vw, 64px); line-height: 1; }
    .np-arrow { font-size: clamp(24px, 3vw, 40px); }
    .bts-section { padding: 0 28px; }
    .bts-label { font-family: 'Jost', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,239,94,0.4); border-top: 1px solid rgba(255,239,94,0.12); padding-top: 28px; margin-bottom: 16px; }
    .bts-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
    .bts-photo { aspect-ratio: 1; overflow: hidden; cursor: pointer; background: rgba(255,255,255,0.04); }
    .bts-photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s; }
    .bts-photo:hover img { transform: scale(1.06); }

    /* ── LIGHTBOX ────────────────────────────────────────────────────── */
    .lightbox { display: none; position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.92); align-items: center; justify-content: center; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; display: block; }
    .lightbox-close { position: absolute; top: 24px; right: 28px; background: none; border: 1px solid rgba(255,239,94,0.4); color: var(--yellow); width: 40px; height: 40px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
    .lightbox-close:hover { background: var(--yellow); color: var(--blue); }

    /* ── POSTCARD FOOTER ─────────────────────────────────────────────── */
    .postcard-footer { margin: 0 28px var(--nav-h); }
    .pc-wrap { position: relative; margin-bottom: -24.3%; }
    .pc-bg { width: 100%; display: block; }
    .pc-form { position: absolute; left: 10%; right: 10.5%; top: 14%; bottom: 15%; display: flex; pointer-events: none; }
    .pc-form * { pointer-events: all; }
    .pc-msg {
      flex: 1;
      background: transparent;
      border: none;
      resize: none;
      font-family: 'Jost', sans-serif;
      font-weight: 700;
      font-size: clamp(13px, 1.6vw, 18px);
      color: #1800AD;
      outline: none;
      padding: 27% 6% 4% 11%;
      line-height: 1.5;
      overflow-y: auto;
      -webkit-touch-callout: none;
    }
    .pc-msg::placeholder { color: rgba(24,0,173,0.45); font-weight: 700; }
    .pc-char-count {
      position: absolute;
      bottom: 18%;
      left: 12%;
      font-family: 'Jost', sans-serif;
      font-size: clamp(9px, 1vw, 11px);
      color: rgba(24,0,173,0.35);
      pointer-events: none;
    }
    .pc-addr { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 8% 4% 22% 7%; }
    .pc-to { font-family: 'Jost', sans-serif; font-weight: 700; font-size: clamp(12px, 1.5vw, 20px); color: #1800AD; letter-spacing: 0.04em; padding-bottom: 2.5%; }
    .pc-row { display: flex; align-items: center; padding: 3.5% 0 1.5%; gap: 4px; }
    .pc-lbl { font-family: 'Jost', sans-serif; font-weight: 700; font-size: clamp(11px, 1.3vw, 17px); color: rgba(24,0,173,0.7); white-space: nowrap; }
    .pc-input { flex: 1; background: transparent; border: none; color: #1800AD; font-family: 'Jost', sans-serif; font-weight: 300; font-size: clamp(12px, 1.4vw, 18px); outline: none; min-width: 0; }
    .pc-input::placeholder { color: rgba(24,0,173,0.3); }
    .pc-addr > :nth-child(1) { margin-bottom: 5px; }
    .pc-addr > :nth-child(2) { margin-bottom: 5px; }
    .pc-addr > :nth-child(4) { margin-top: 10px; }
    .pc-send { margin-top: 4%; position: relative; top: 20px; align-self: flex-end; margin-right: 70px; background: none; border: 1px solid rgba(120,100,70,0.5); color: #1800AD; font-family: 'Jost', sans-serif; font-weight: 700; font-size: clamp(11px, 1.2vw, 15px); letter-spacing: 0.12em; text-transform: uppercase; padding: 5px 10px; cursor: pointer; transition: background 0.2s; }
    .pc-send:hover { background: rgba(120,100,70,0.12); }
    .pc-send:disabled { opacity: 0.4; cursor: not-allowed; }
    .pc-sent { position: absolute; left: 10%; right: 10%; top: 40%; text-align: center; font-family: 'Jost', sans-serif; font-weight: 300; font-size: clamp(15px, 1.8vw, 23px); color: #1800AD; letter-spacing: 0.08em; }

    /* ── RESPONSIVE ──────────────────────────────────────────────────── */
    @media (max-width: 900px) {
      .work-grid, .works-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .project-body { padding: 36px 16px; }
      .bts-grid { grid-template-columns: repeat(2, 1fr); }
      .project-hero { height: 55vh; min-height: 300px; }
      .sm-title { font-size: clamp(52px, 11vw, 100px); left: 14%; }
      #sm-red-fig  { height: 72vh; }
      #sm-blue-fig { height: 68vh; }
      #sm-rabbit   { height: 30vh; }
      #sm-flytrap  { height: 40vh; }
    }
    @media (max-width: 640px) {
      body { padding-bottom: env(safe-area-inset-bottom, 0px); }
      /* compact nav — stays visible, no hamburger */
      nav { padding: 0 14px; }
      .nav-links { gap: 12px; }
      .nav-links a, .dropdown-toggle { font-size: 11px; letter-spacing: 0.1em; }
      .nav-dropdown { right: 0; left: auto; min-width: 130px; }
      .work-grid { grid-template-columns: repeat(2, 1fr); }
      .project-body { padding: 28px 20px; }
      .next-project-bar { padding: 32px 20px 0; }
      .postcard-footer { margin: 0 0 var(--nav-h); }
      .pc-msg { font-size: 14px; padding: 13% 4% 4% 9%; }

      /* home */
      .works-section { padding: 48px 16px 0; }
      .works-grid { grid-template-columns: repeat(2, 1fr); }
      .view-all-wrap { padding: 28px 16px; }
      .contact-strip { margin: 0 16px; padding: 48px 0; }
      .c-blue-fig, .c-red-fig { width: clamp(80px, 20vw, 110px); }
      .c-blue-fig { left: 2%; }
      .c-red-fig  { right: 2%; }
      .hero-cta-link { font-size: clamp(52px, 13vw, 80px); }

      /* expand panel */
      .expand-bts-grid { grid-template-columns: repeat(2, 1fr); }

      /* stop motion */
      .sm-title { font-size: clamp(44px, 11vw, 72px); left: 10%; right: 1%; }
      #sm-red-fig        { height: 68vh; }
      #sm-blue-fig       { height: 64vh; }
      #sm-rabbit         { height: 24vh; left: 20%; bottom: 8%; }
      #sm-flytrap        { height: 32vh; left: 36%; bottom: 1%; }
      #sm-two-head-worm  { height: 9vh;  left: 50%; top: 38%; }
      #sm-millipede      { height: 14vh; left: 52%; top: 50%; }
      #sm-mama-bird      { height: 14vh; left: 60%; bottom: 20%; }
      #sm-metal-fly      { height: 12vh; left: 68%; top: 20%; }
      #sm-snake          { height: 10vh; right: 18%; top: 55%; }
      #sm-worm           { height: 8vh;  left: 46%; top: 52%; }
    }
    @media (max-width: 420px) {
      /* keep 2-column grid even on small phones */
      .work-grid { grid-template-columns: repeat(2, 1fr); }
      .works-grid { grid-template-columns: repeat(2, 1fr); }
      .bts-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (hover: none) {
      .tile-overlay { opacity: 1; background: linear-gradient(to top, rgba(24,0,173,0.85) 0%, transparent 50%); }
    }

    /* ── IMAGE PROTECTION ────────────────────────────────────────────── */
    img { -webkit-user-drag: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .work-tile, .bts-photo, .home-hero, .project-hero, .sm-hero { user-select: none; -webkit-user-select: none; }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav id="mainNav">
    <a href="#" class="nav-logo"><img src="assets/g-logo.png" alt="6rac13"></a>
    <ul class="nav-links">
      <li class="nav-dropdown-wrap" id="workDropWrap">
        <button class="dropdown-toggle" id="workToggle">Work</button>
        <div class="nav-dropdown" id="workDropdown">
          <a href="#work">All Work</a>
          <a href="#work/art">Art</a>
          <a href="#work/portraits">Portraits</a>
          <a href="#work/videoart">Video Art</a>
          <a href="#stopmotion">Stop Motion</a>
          <a href="#work/events">Events</a>
        </div>
      </li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <!-- ── VIEW: HOME ──────────────────────────────────────────────────── -->
  <div class="view" id="view-home">
    <section class="home-hero">

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script>
    /* ── Firebase ─────────────────────────────────────────────────────── */
    firebase.initializeApp({
      apiKey:            "AIzaSyDmNYdW7lFABFWjA_eSEDqmd2YuOrX32g8",
      authDomain:        "rac13-12cca.firebaseapp.com",
      databaseURL:       "https://rac13-12cca-default-rtdb.firebaseio.com",
      projectId:         "rac13-12cca",
      storageBucket:     "rac13-12cca.firebasestorage.app",
      messagingSenderId: "761534687296",
      appId:             "1:761534687296:web:04fef318d00c1f7b0457a5"
    });
    const db = firebase.database();

    /* ── Data cache ───────────────────────────────────────────────────── */
    let allProjects = null;
    function loadProjects(cb) {
      if (allProjects !== null) { cb(allProjects); return; }
      db.ref('projects').orderByChild('order').once('value', snap => {
        allProjects = [];
        snap.forEach(child => { const p = child.val(); p.id = child.key; if (p.visible) allProjects.push(p); });
        cb(allProjects);
      });
    }

    /* Transparent multi-category migration */
    function getCategories(p) {
      if (Array.isArray(p.categories) && p.categories.length) return p.categories;
      if (p.category) return [p.category];
      return [];
    }

    const CAT_LABELS = { all: 'Work', art: 'Art', portraits: 'Portraits', videoart: 'Video Art', stopmotion: 'Stop Motion', events: 'Events' };

    /* ── Nav ──────────────────────────────────────────────────────────── */
    window.addEventListener('scroll', () => {
      document.getElementById('mainNav').classList.toggle('scrolled', window.scrollY > 10);
    });

    const workDropWrap = document.getElementById('workDropWrap');
    document.getElementById('workToggle').addEventListener('click', e => { e.preventDefault(); workDropWrap.classList.toggle('open'); });
    document.addEventListener('click', e => { if (!workDropWrap.contains(e.target)) workDropWrap.classList.remove('open'); });


    /* ── Lightbox ─────────────────────────────────────────────────────── */
    const lightbox = document.getElementById('lightbox');
    const lightboxMedia = document.getElementById('lightboxMedia');
    function closeLightbox() { lightboxMedia.innerHTML = ''; lightbox.classList.remove('open'); }
    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    function openLightbox(src) {
      const isVid = /\.(mp4|mov|webm)(\?|$)/i.test(src);
      lightboxMedia.innerHTML = isVid
        ? `<video src="${src}" controls autoplay muted style="max-width:90vw;max-height:90vh;display:block;"></video>`
        : `<img src="${src}" alt="" style="max-width:90vw;max-height:90vh;object-fit:contain;display:block;">`;
      lightbox.classList.add('open');
    }

    /* ── Tile ─────────────────────────────────────────────────────────── */
    function tileHTML(p, filter) {
      const cats = getCategories(p);
      let media;
      if (!p.heroUrl) {
        media = `<div class="tile-img skeleton"></div>`;
      } else if (p.heroType === 'youtube') {
        const ytId = getYouTubeId(p.heroUrl);
        media = ytId
          ? `<img class="tile-img" src="https://img.youtube.com/vi/${ytId}/hqdefault.jpg" alt="${p.title}" loading="lazy">`
          : `<div class="tile-img skeleton"></div>`;
      } else if (p.heroType === 'video' || /\.(mp4|mov|webm)(\?|$)/i.test(p.heroUrl)) {
        media = `<video class="tile-img" src="${p.heroUrl}" muted playsinline loop preload="metadata"></video>`;
      } else {
        media = `<img class="tile-img" src="${p.heroUrl}" alt="${p.title}" loading="lazy">`;
      }
      return `<div class="work-tile" data-id="${p.id}" data-filter="${filter || 'all'}">
        ${media}
        <div class="tile-protect"></div>
        <div class="tile-overlay"><span class="tile-title">${p.title}</span></div>
      </div>`;
    }

    /* ── BTS link thumbnails ─────────────────────────────────────────── */
    function getYouTubeId(url) {
      const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      return m ? m[1] : null;
    }

    function getVimeoId(url) {
      const m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
      return m ? m[1] : null;
    }

    function btsLinkCardHTML(url, lbl) {
      const ytId = getYouTubeId(url);
      if (ytId) {
        return `<div class="bts-embed">
          <div class="bts-embed-wrap"><iframe src="https://www.youtube.com/embed/${ytId}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
          ${lbl ? `<div class="bts-embed-label">${lbl}</div>` : ''}
        </div>`;
      }
      const vimeoId = getVimeoId(url);
      if (vimeoId) {
        return `<div class="bts-embed">
          <div class="bts-embed-wrap"><iframe src="https://player.vimeo.com/video/${vimeoId}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>
          ${lbl ? `<div class="bts-embed-label">${lbl}</div>` : ''}
        </div>`;
      }
      return `<a class="bts-link-card" href="${url}" target="_blank" rel="noopener">
        <span class="bts-link-icon">${platformIcon(url)}</span>
        <span class="bts-link-label">${lbl}</span>
      </a>`;
    }

    function loadVimeoThumbs(container) {
      container.querySelectorAll('[data-vimeo]').forEach(el => {
        const url = decodeURIComponent(el.dataset.vimeo);
        fetch(`https://vimeo.com/api/oembed.json?url=${encodeURIComponent(url)}`)
          .then(r => r.json())
          .then(d => {
            if (d.thumbnail_url) {
              const thumb = el.querySelector('.bts-link-thumb-img');
              if (thumb) thumb.style.backgroundImage = `url('${d.thumbnail_url}')`;
            }
          })
          .catch(() => {});
      });
    }

    /* ── Inline Expand ────────────────────────────────────────────────── */
    const PROJECT_OPEN_MODE = 'inline';
    let openProjectId = null;
    let currentGridId = 'workGrid';

    function platformIcon(url) {
      if (/youtube\.com|youtu\.be/i.test(url)) return '▶';
      if (/vimeo\.com/i.test(url)) return '▶';
      if (/instagram\.com/i.test(url)) return '◈';
      if (/tiktok\.com/i.test(url)) return '♪';
      return '▶';
    }

    function platformName(url) {
      if (/youtube\.com|youtu\.be/i.test(url)) return 'YouTube';
      if (/vimeo\.com/i.test(url)) return 'Vimeo';
      if (/instagram\.com/i.test(url)) return 'Instagram';
      if (/tiktok\.com/i.test(url)) return 'TikTok';
      return 'Watch';
    }

    function expandProject(p, filter) {
      closeExpand(false);
      openProjectId = p.id;

      const grid = document.getElementById(currentGridId);
      const tile = grid.querySelector(`.work-tile[data-id="${p.id}"]`);
      if (!tile) return;

      /* find which column the tile is in to insert expand row after its row */
      const cols = getGridCols();
      const tiles = [...grid.querySelectorAll('.work-tile:not(.expand-row)')];
      const tileIdx = tiles.indexOf(tile);
      const rowEnd = Math.ceil((tileIdx + 1) / cols) * cols - 1;
      const anchorTile = tiles[Math.min(rowEnd, tiles.length - 1)];

      const btsPhotos = p.btsPhotos
        ? (Array.isArray(p.btsPhotos) ? p.btsPhotos : Object.values(p.btsPhotos))
        : [];
      const btsLinks = Array.isArray(p.btsLinks) ? p.btsLinks : [];

      let heroHTML = '';
      if (p.heroType === 'youtube' && p.heroUrl) {
        const ytId = getYouTubeId(p.heroUrl);
        if (ytId) heroHTML = `<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;width:100%"><iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&mute=1" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
      } else if (p.heroType === 'video' && p.heroUrl) {
        heroHTML = `<video src="${p.heroUrl}" autoplay muted loop playsinline style="max-width:100%;max-height:75vh;width:100%;height:100%;object-fit:contain;display:block;"></video>`;
      } else if (p.heroUrl) {
        heroHTML = `<img src="${p.heroUrl}" alt="${p.title}" style="max-width:100%;max-height:75vh;width:100%;height:100%;object-fit:contain;display:block;">`;
      }

      let btsPhotoHTML = '';
      if (btsPhotos.length) {
        btsPhotoHTML = `<div class="expand-bts-label">Behind the Scenes</div>
          <div class="expand-bts-grid">${btsPhotos.map(url => {
            const isVid = /\.(mp4|mov|webm)(\?|$)/i.test(url);
            const media = isVid
              ? `<video src="${url}" muted playsinline loop preload="metadata" style="width:100%;height:100%;object-fit:cover;display:block;"></video>`
              : `<img src="${url}" alt="BTS" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;">`;
            return `<div class="bts-photo" onclick="openLightbox('${url}')">${media}</div>`;
          }).join('')}</div>`;
      }

      let btsLinkHTML = '';
      if (btsLinks.length) {
        const label = btsPhotos.length ? '' : `<div class="expand-bts-label">Behind the Scenes</div>`;
        btsLinkHTML = `${label}<div class="expand-bts-link-grid">${btsLinks.map(lk => {
          const url = typeof lk === 'string' ? lk : lk.url;
          const lbl = (typeof lk === 'object' && lk.label) ? lk.label : platformName(url);
          return btsLinkCardHTML(url, lbl);
        }).join('')}</div>`;
      }

      const hasBts = btsPhotos.length || btsLinks.length;

      const expandRow = document.createElement('div');
      expandRow.className = 'expand-row';
      expandRow.id = 'expandRow';
      expandRow.innerHTML = `<div class="expand-inner">
        <div class="expand-panel">
          <button class="expand-close" id="expandClose">✕</button>
          <div class="expand-hero">${heroHTML}</div>
          <div class="expand-body">
            <h2 class="expand-title">${p.title}</h2>
            <p class="expand-desc">${p.description || ''}</p>
          </div>
          ${hasBts ? `<div class="expand-bts">${btsPhotoHTML}${btsLinkHTML}</div>` : ''}
        </div>
      </div>`;

      anchorTile.after(expandRow);
      loadVimeoThumbs(expandRow);
      requestAnimationFrame(() => { requestAnimationFrame(() => { expandRow.classList.add('open'); }); });

      expandRow.querySelector('#expandClose').addEventListener('click', () => closeExpand(true));

      /* URL + scroll */
      const url = filter && filter !== 'all' ? `#work/${filter}?p=${p.id}` : `#work?p=${p.id}`;
      history.pushState({ expandId: p.id, filter }, '', url);
      setTimeout(() => {
        const navH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--nav-h')) || 80;
        const rect = expandRow.getBoundingClientRect();
        const targetScroll = window.pageYOffset + rect.top - navH - 8;
        window.scrollTo({ top: targetScroll, behavior: 'smooth' });
      }, 420);
    }

    function closeExpand(pushState) {
      const row = document.getElementById('expandRow');
      if (!row) return;
      row.classList.remove('open');
      openProjectId = null;
      setTimeout(() => { if (row.parentNode) row.parentNode.removeChild(row); }, 420);
      if (pushState) history.back();
    }

    function getGridCols() {
      const grid = document.getElementById(currentGridId);
      if (!grid) return 3;
      const style = window.getComputedStyle(grid);
      return style.gridTemplateColumns.split(' ').length;
    }

    /* Esc to close */
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeExpand(true); closeLightbox(); } });

    /* popstate — back button closes expand */
    window.addEventListener('popstate', e => {
      const row = document.getElementById('expandRow');
      if (row) { row.classList.remove('open'); openProjectId = null; setTimeout(() => { if (row.parentNode) row.parentNode.removeChild(row); }, 420); }
      else route();
    });

    /* ── Router ───────────────────────────────────────────────────────── */
    const VIEWS = ['home', 'work', 'stopmotion', 'project'];
    let videoHeroSet = false;
    let smLayoutLoaded = false;

    function showView(name) {
      VIEWS.forEach(v => document.getElementById(`view-${v}`).classList.remove('active'));
      document.getElementById(`view-${name}`).classList.add('active');
      window.scrollTo(0, 0);
    }

    function setNavActive(view, filter) {
      const toggle = document.getElementById('workToggle');
      const isWork = (view === 'work' || view === 'stopmotion');
      toggle.classList.toggle('active', isWork);
      document.querySelectorAll('#workDropdown a').forEach(a => {
        const h = a.getAttribute('href');
        const match = (view === 'stopmotion' && h === '#stopmotion') ||
                      (view === 'work' && (filter === 'all' || !filter) && h === '#work') ||
                      (view === 'work' && filter && filter !== 'all' && h === `#work/${filter}`);
        a.classList.toggle('active-filter', match);
      });
    }

    function setTitle(text) {
      const el = document.getElementById('headerTitle');
      if (el.textContent === text) return;
      el.classList.add('fading');
      setTimeout(() => { el.textContent = text; el.classList.remove('fading'); }, 280);
    }

    document.getElementById('heroWorkCta').addEventListener('click', e => {
      e.preventDefault();
      document.getElementById('works-grid-section').scrollIntoView({ behavior: 'smooth' });
    });

    function attachTileClicks(filter) {
      document.querySelectorAll(`#${currentGridId} .work-tile`).forEach(tile => {
        tile.addEventListener('click', e => {
          e.preventDefault();
          const id = tile.dataset.id;
          if (!id) return;
          if (openProjectId === id) { closeExpand(true); return; }
          loadProjects(ps => {
            const p = ps.find(x => x.id === id);
            if (p) expandProject(p, filter);
          });
        });
      });
    }

    function route() {
      const raw   = location.hash.slice(1) || '';
      const [hashPart, queryPart] = raw.split('?');
      const parts = hashPart.split('/');
      const view  = parts[0];
      const queryParams = {};
      if (queryPart) queryPart.split('&').forEach(kv => { const [k,v] = kv.split('='); queryParams[k] = v; });
      workDropWrap.classList.remove('open');

      if (view && document.getElementById(view)) return;

      if (!view || view === 'home') {
        showView('home');
        setNavActive('home', null);
        document.title = '6rac13';
        loadProjects(ps => {
          const grid = document.getElementById('worksGrid');
          grid.innerHTML = ps.length ? ps.map(p => tileHTML(p, null)).join('') : '';
          grid.querySelectorAll('.work-tile').forEach(tile => {
            tile.addEventListener('click', () => {
              const id = tile.dataset.id;
              if (id) location.hash = `work?p=${id}`;
            });
          });
        });

      } else if (view === 'work') {
        const filter = parts[1] || 'all';
        showView('work');
        setNavActive('work', filter);
        document.title = `${CAT_LABELS[filter] || 'Work'} — 6rac13`;
        setTitle(CAT_LABELS[filter] || filter);

        const hero = document.getElementById('videoArtHero');
        const pageHeader = document.querySelector('#view-work .page-header');
        if (filter === 'videoart') {
          hero.style.display = 'flex';
          if (pageHeader) pageHeader.style.display = 'none';
          if (!videoHeroSet) {
            document.getElementById('vahBg').innerHTML = `<video src="assets/videoart-hero.mp4" autoplay muted loop playsinline style="width:100%;height:100%;object-fit:cover;display:block;"></video>`;
            videoHeroSet = true;
          }
        } else {
          hero.style.display = 'none';
          if (pageHeader) pageHeader.style.display = '';
        }

        currentGridId = 'workGrid';
        loadProjects(ps => {
          const grid = document.getElementById('workGrid');
          const list = filter === 'all' ? ps : ps.filter(p => getCategories(p).includes(filter));
          grid.innerHTML = list.length
            ? list.map(p => tileHTML(p, filter)).join('')
            : `<div class="works-empty" style="display:block">No projects in this category yet.</div>`;
          attachTileClicks(filter);

          /* restore expanded project if URL had ?p= */
          if (queryParams.p) {
            const p = list.find(x => x.id === queryParams.p);
            if (p) setTimeout(() => expandProject(p, filter), 100);
          }
        });

      } else if (view === 'stopmotion') {
        showView('stopmotion');
        setNavActive('stopmotion', null);
        document.title = 'Stop Motion — 6rac13';
        if (!smLayoutLoaded) {
          smLayoutLoaded = true;
          const smKey = window.innerWidth < 768 ? 'mobile' : 'desktop';
          fetch('https://rac13-12cca-default-rtdb.firebaseio.com/stopmotionLayout/' + smKey + '.json')
            .then(r => r.json())
            .then(data => {
              if (!data || typeof data !== 'object') return;
              const hero = document.querySelector('#view-stopmotion .sm-hero');
              hero.querySelectorAll('.sm-char').forEach(el => el.remove());
              Object.values(data)
                .sort((a, b) => (a.zIndex || 1) - (b.zIndex || 1))
                .forEach(layer => {
                  const img = document.createElement('img');
                  img.src = layer.src;
                  img.className = 'sm-char';
                  img.alt = '';
                  const transforms = [];
                  if (layer.rotation) transforms.push('rotate(' + layer.rotation + 'deg)');
                  if (layer.flipH)    transforms.push('scaleX(-1)');
                  if (layer.flipV)    transforms.push('scaleY(-1)');
                  img.style.cssText = [
                    'position:absolute',
                    'left:'    + layer.left  + '%',
                    'top:'     + layer.top   + '%',
                    'width:'   + layer.width + '%',
                    'height:auto',
                    'z-index:' + (layer.zIndex || 1),
                    'object-fit:contain',
                    transforms.length ? 'transform:' + transforms.join(' ') : '',
                    'transform-origin:center center'
                  ].filter(Boolean).join(';');
                  hero.appendChild(img);
                });
            })
            .catch(() => {});
        }
        /* load stopmotion-tagged projects below hero */
        currentGridId = 'smWorkGrid';
        loadProjects(ps => {
          const grid = document.getElementById('smWorkGrid');
          const list = ps.filter(p => getCategories(p).includes('stopmotion'));
          grid.innerHTML = list.length ? list.map(p => tileHTML(p, 'stopmotion')).join('') : '';
          attachTileClicks('stopmotion');
        });

      } else {
        location.hash = '';
      }
    }

    /* ── Postcard ─────────────────────────────────────────────────────── */
    const pcMsg = document.getElementById('pcMsg');
    const pcCharCount = document.getElementById('pcCharCount');
    pcMsg.addEventListener('input', () => {
      pcCharCount.textContent = `${pcMsg.value.length} / 500`;
    });

    document.getElementById('pcForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = e.currentTarget.querySelector('.pc-send');
      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        const res = await fetch(e.currentTarget.action, { method: 'POST', body: new FormData(e.currentTarget), headers: { 'Accept': 'application/json' } });
        if (res.ok) { e.currentTarget.style.display = 'none'; document.getElementById('pcSent').style.display = 'block'; pcCharCount.style.display = 'none'; }
        else { btn.disabled = false; btn.textContent = 'Try Again →'; }
      } catch { btn.disabled = false; btn.textContent = 'Try Again →'; }
    });

    /* ── Image protection ────────────────────────────────────────────── */
    document.addEventListener('contextmenu', e => {
      if (e.target.tagName === 'IMG' || e.target.tagName === 'VIDEO' ||
          e.target.closest('.work-tile, .bts-photo, .project-hero, .home-hero, .sm-hero, .expand-hero'))
        e.preventDefault();
    });
    document.addEventListener('dragstart', e => { if (e.target.tagName === 'IMG' || e.target.tagName === 'VIDEO') e.preventDefault(); });

    /* ── Boot ─────────────────────────────────────────────────────────── */
    window.addEventListener('hashchange', () => { if (!document.getElementById('expandRow')) route(); });
    route();
  </script>
</body>
</html>
