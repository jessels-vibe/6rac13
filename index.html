<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6rac13 — Grace Fairchild Vanderlaan</title>
  <link rel="icon" href="assets/g-logo.png">
  <style>
    @font-face {
      font-family: 'Amoresa Aged';
      src: url('assets/fonts/AmorosaAged.otf') format('opentype');
      font-weight: normal; font-style: normal;
    }
    @font-face {
      font-family: 'Coco Gothic';
      src: url('assets/fonts/CocoGothic.ttf') format('truetype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Coco Gothic';
      src: url('assets/fonts/CocoGothic-Bold.ttf') format('truetype');
      font-weight: 700;
    }
    @font-face {
      font-family: 'Coco Gothic';
      src: url('assets/fonts/CocoGothic-Light.ttf') format('truetype');
      font-weight: 300;
    }

    :root {
      --blue:   #1C1CCC;
      --yellow: #F2C800;
      --dark:   #28283A;
      --red:    #CC1818;
      --cream:  #F0E4C4;
      --nav-h:  80px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--blue);
      color: var(--yellow);
      font-family: 'Coco Gothic', sans-serif;
      min-height: 100vh;
    }

    /* ── NAV ─────────────────────────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0; z-index: 200;
      height: var(--nav-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px;
      background: var(--blue);
      transition: box-shadow 0.3s;
    }

    nav.scrolled { box-shadow: 0 1px 0 rgba(242,200,0,0.15); }

    .nav-logo { display: flex; align-items: center; text-decoration: none; }
    .nav-logo img { height: 62px; width: auto; object-fit: contain; display: block; }

    .nav-links { display: flex; gap: 52px; list-style: none; }
    .nav-links a {
      color: var(--yellow); text-decoration: none;
      font-family: 'Coco Gothic', sans-serif; font-weight: 700;
      font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .nav-links a:hover { opacity: 0.6; }
    .nav-links a.active { border-bottom: 2px solid var(--yellow); }

    .nav-dropdown-wrap { position: relative; }
    .dropdown-toggle { cursor: pointer; background: none; border: none; padding: 0; }
    .nav-dropdown {
      position: absolute; top: calc(100% + 12px); left: -16px;
      background: var(--blue); border: 1px solid rgba(242,200,0,0.25);
      min-width: 160px; display: none; flex-direction: column; z-index: 300;
    }
    .nav-dropdown-wrap.open .nav-dropdown { display: flex; }
    .nav-dropdown a {
      padding: 12px 20px; color: rgba(242,200,0,0.75); text-decoration: none;
      font-family: 'Coco Gothic', sans-serif; font-weight: 700; font-size: 12px;
      letter-spacing: 0.14em; text-transform: uppercase; transition: color 0.15s;
      border-left: 2px solid transparent;
    }
    .nav-dropdown a:hover { color: var(--yellow); border-left-color: var(--yellow); background: rgba(242,200,0,0.04); }

    /* ── HERO ────────────────────────────────────────────────────────── */
    .home-hero {
      height: 100vh;
      padding-top: var(--nav-h);
      position: relative;
      overflow: hidden;
    }

    /* ID card — centered, slightly above midpoint */
    .hero-card-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -56%);
      z-index: 10;
    }
    .hero-card-wrap img {
      width: clamp(300px, 52vw, 740px);
      display: block;
      box-shadow: 0 28px 90px rgba(0,0,0,0.45);
    }

    /* flanking figures */
    .c-blue-fig {
      position: absolute;
      left: 2%;
      bottom: 18%;
      width: clamp(150px, 19vw, 290px);
      z-index: 5;
    }
    .c-red-fig {
      position: absolute;
      right: 2%;
      bottom: 18%;
      width: clamp(150px, 19vw, 290px);
      z-index: 5;
    }
    .c-blue-fig img,
    .c-red-fig img { width: 100%; height: auto; display: block; }

    /* Work / Contact CTAs */
    .hero-ctas {
      position: absolute;
      bottom: 4%;
      left: 0; right: 0;
      display: flex;
      justify-content: space-around;
      padding: 0 8%;
      z-index: 20;
    }
    .hero-cta-link {
      font-family: 'Amoresa Aged', cursive;
      font-size: clamp(68px, 11vw, 160px);
      color: var(--yellow);
      text-decoration: none;
      line-height: 0.85;
      transition: opacity 0.2s;
    }
    .hero-cta-link:hover { opacity: 0.72; }

    /* ── SELECTED WORKS ──────────────────────────────────────────────── */
    .works-section { padding: 80px 28px 0; }

    .section-label {
      font-family: 'Coco Gothic', sans-serif; font-weight: 700;
      font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(242,200,0,0.5); margin-bottom: 20px;
    }

    .section-script {
      font-family: 'Amoresa Aged', cursive;
      font-size: clamp(52px, 8vw, 100px);
      color: var(--yellow); line-height: 0.9; margin-bottom: 40px;
    }

    .works-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
    }

    .work-tile {
      position: relative; overflow: hidden; cursor: pointer;
      background: rgba(255,255,255,0.04); aspect-ratio: 4/5;
      text-decoration: none;
    }
    .work-tile:nth-child(4n+1) { aspect-ratio: 3/4; }
    .work-tile:nth-child(4n+2) { aspect-ratio: 1/1; }

    .tile-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s ease; }
    .work-tile:hover .tile-img { transform: scale(1.05); }

    .tile-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(28,28,204,0.92) 0%, transparent 55%);
      opacity: 0; transition: opacity 0.3s ease;
      display: flex; flex-direction: column; justify-content: flex-end; padding: 20px;
    }
    .work-tile:hover .tile-overlay { opacity: 1; }

    .tile-cat {
      font-family: 'Coco Gothic', sans-serif; font-weight: 700; font-size: 10px;
      letter-spacing: 0.15em; text-transform: uppercase; color: rgba(242,200,0,0.7); margin-bottom: 6px;
    }
    .tile-title {
      font-family: 'Amoresa Aged', cursive; font-size: 28px; color: var(--yellow); line-height: 1;
    }

    .works-empty {
      display: none; grid-column: 1/-1; text-align: center; padding: 80px 20px;
      color: rgba(242,200,0,0.4); font-size: 14px; letter-spacing: 0.05em;
    }

    .view-all-wrap { padding: 40px 28px; }
    .view-all {
      font-family: 'Coco Gothic', sans-serif; font-weight: 700; font-size: 12px;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--yellow);
      text-decoration: none; border-bottom: 1px solid var(--yellow); padding-bottom: 2px;
      transition: opacity 0.2s;
    }
    .view-all:hover { opacity: 0.6; }

    /* ── CONTACT STRIP ───────────────────────────────────────────────── */
    .contact-strip {
      margin: 0 28px; border-top: 1px solid rgba(242,200,0,0.2);
      padding: 64px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 40px;
    }
    .contact-strip h2 {
      font-family: 'Amoresa Aged', cursive; font-size: clamp(48px, 7vw, 88px);
      color: var(--yellow); line-height: 0.9; grid-column: 1/-1;
    }
    .contact-col p, .contact-col a {
      font-family: 'Coco Gothic', sans-serif; font-weight: 300; font-size: 14px;
      color: rgba(242,200,0,0.75); text-decoration: none; line-height: 2; display: block;
    }
    .contact-col a:hover { color: var(--yellow); }

    /* ── POSTCARD FOOTER ─────────────────────────────────────────────── */
    .postcard-footer {
      margin: 0 28px 40px; background: var(--cream);
      display: grid; grid-template-columns: 1fr 1px 160px; min-height: 140px;
    }
    .pc-left { padding: 24px; display: flex; flex-direction: column; justify-content: space-between; }
    .pc-brand { font-family: 'Amoresa Aged', cursive; font-size: 28px; color: var(--dark); opacity: 0.5; }
    .pc-lines { display: flex; flex-direction: column; gap: 10px; flex: 1; margin-top: 16px; }
    .pc-line { height: 1px; background: rgba(40,40,58,0.2); }
    .pc-divider { background: rgba(40,40,58,0.15); }
    .pc-right { padding: 16px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; }
    .pc-stamp { width: 48px; height: 56px; border: 1px solid rgba(40,40,58,0.2); display: flex; align-items: center; justify-content: center; }
    .pc-stamp img { width: 32px; height: 32px; object-fit: contain; }
    .pc-addr-lines { width: 100%; display: flex; flex-direction: column; gap: 8px; }
    .pc-addr-line { height: 1px; background: rgba(40,40,58,0.2); }

    /* ── SKELETON ────────────────────────────────────────────────────── */
    .skeleton { background: rgba(255,255,255,0.06); animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.06; } 50% { opacity: 0.12; } }

    /* ── MOBILE ──────────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      .works-grid { grid-template-columns: repeat(2, 1fr); }
      .contact-strip { grid-template-columns: 1fr; }
      .c-blue-fig, .c-red-fig { width: clamp(100px, 14vw, 180px); bottom: 22%; }
      .hero-card-wrap img { width: clamp(240px, 70vw, 500px); }
      .hero-cta-link { font-size: clamp(48px, 9vw, 100px); }
      .nav-links { gap: 28px; }
      .nav-links a { font-size: 13px; }
    }

    @media (max-width: 480px) {
      .works-grid { grid-template-columns: 1fr; }
      .postcard-footer { grid-template-columns: 1fr; min-height: auto; }
      .pc-divider, .pc-right { display: none; }
      .c-blue-fig { display: none; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav id="mainNav">
    <a href="index.html" class="nav-logo">
      <img src="assets/g-logo.png" alt="6rac13">
    </a>
    <ul class="nav-links">
      <li class="nav-dropdown-wrap" id="workDropWrap">
        <a href="work.html" class="dropdown-toggle" id="workToggle">Work</a>
        <div class="nav-dropdown" id="workDropdown">
          <a href="work.html">All Work</a>
          <a href="work.html?filter=art">Art</a>
          <a href="work.html?filter=videoart">Video Art</a>
          <a href="work.html?filter=events">Events</a>
        </div>
      </li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="shop.html">Shop</a></li>
    </ul>
  </nav>

  <!-- HERO -->
  <section class="home-hero">
    <div class="c-blue-fig"><img src="assets/blue-fig.png" alt=""></div>
    <div class="hero-card-wrap">
      <img src="assets/id-card.png" alt="Grace Fairchild Vanderlaan — 6rac13">
    </div>
    <div class="c-red-fig"><img src="assets/red-fig.png" alt=""></div>
    <div class="hero-ctas">
      <a href="work.html" class="hero-cta-link">Work</a>
      <a href="contact.html" class="hero-cta-link">Contact</a>
    </div>
  </section>

  <!-- SELECTED WORKS -->
  <section class="works-section">
    <p class="section-label">Selected Works</p>
    <h2 class="section-script">Work</h2>
    <div class="works-grid" id="worksGrid">
      <div class="work-tile skeleton"></div>
      <div class="work-tile skeleton"></div>
      <div class="work-tile skeleton"></div>
      <div class="work-tile skeleton"></div>
      <div class="work-tile skeleton"></div>
      <div class="work-tile skeleton"></div>
    </div>
    <div class="view-all-wrap">
      <a href="work.html" class="view-all">View All Work</a>
    </div>
  </section>

  <!-- CONTACT STRIP -->
  <section class="contact-strip">
    <h2>Get in touch</h2>
    <div class="contact-col">
      <a href="mailto:gracefairchildvanderlaan@gmail.com">gracefairchildvanderlaan@gmail.com</a>
    </div>
    <div class="contact-col">
      <a href="https://instagram.com/6rac13" target="_blank" rel="noopener">@6rac13</a>
    </div>
  </section>

  <!-- POSTCARD FOOTER -->
  <footer class="postcard-footer">
    <div class="pc-left">
      <span class="pc-brand">6rac13</span>
      <div class="pc-lines">
        <div class="pc-line"></div>
        <div class="pc-line"></div>
        <div class="pc-line"></div>
        <div class="pc-line"></div>
      </div>
    </div>
    <div class="pc-divider"></div>
    <div class="pc-right">
      <div class="pc-stamp"><img src="assets/g-logo.png" alt="G"></div>
      <div class="pc-addr-lines">
        <div class="pc-addr-line"></div>
        <div class="pc-addr-line"></div>
        <div class="pc-addr-line"></div>
      </div>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script>
    window.addEventListener('scroll', () => {
      document.getElementById('mainNav').classList.toggle('scrolled', window.scrollY > 10);
    });

    const workWrap = document.getElementById('workDropWrap');
    document.getElementById('workToggle').addEventListener('click', e => { e.preventDefault(); workWrap.classList.toggle('open'); });
    document.addEventListener('click', e => { if (!workWrap.contains(e.target)) workWrap.classList.remove('open'); });

    const firebaseConfig = {
      apiKey:            "AIzaSyDmNYdW7lFABFWjA_eSEDqmd2YuOrX32g8",
      authDomain:        "rac13-12cca.firebaseapp.com",
      databaseURL:       "https://rac13-12cca-default-rtdb.firebaseio.com",
      projectId:         "rac13-12cca",
      storageBucket:     "rac13-12cca.firebasestorage.app",
      messagingSenderId: "761534687296",
      appId:             "1:761534687296:web:04fef318d00c1f7b0457a5"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const CAT_LABELS = { art: 'Art', videoart: 'Video Art', events: 'Events' };

    function tileHTML(p) {
      const cat = CAT_LABELS[p.category] || p.category;
      return `
        <a class="work-tile" href="project.html?id=${p.id}">
          ${p.heroUrl
            ? `<img class="tile-img" src="${p.heroUrl}" alt="${p.title}" loading="lazy">`
            : `<div class="tile-img skeleton"></div>`
          }
          <div class="tile-overlay">
            <span class="tile-cat">${cat}</span>
            <span class="tile-title">${p.title}</span>
          </div>
        </a>`;
    }

    db.ref('projects').orderByChild('order').once('value', snap => {
      const grid = document.getElementById('worksGrid');
      const projects = [];
      snap.forEach(child => {
        const p = child.val();
        p.id = child.key;
        if (p.visible && p.featured) projects.push(p);
      });
      if (projects.length === 0) {
        grid.innerHTML = `<div class="works-empty" style="display:block">No featured works yet.</div>`;
        return;
      }
      grid.innerHTML = projects.map(tileHTML).join('');
    });
  </script>
</body>
</html>
