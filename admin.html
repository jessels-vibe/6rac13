<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — 6rac13</title>
  <link rel="icon" href="assets/g-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --yellow:  #F2C800;
      --blue:    #1C1CCC;
      --dark:    #111111;
      --surface: #F5EDD8;
      --border:  rgba(0,0,0,0.12);
      --text:    #111111;
      --muted:   rgba(0,0,0,0.45);
      --green:   #1A7A3E;
      --red:     #CC1818;
      --bar-h:   56px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #F5EDD8;
      color: var(--text);
      font-family: 'Jost', sans-serif;
      font-size: 13px;
      min-height: 100vh;
    }

    /* ── LOGIN SCREEN ──────────────────────────────────────────────── */
    #loginScreen {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }

    .login-box {
      width: 340px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 40px 32px;
      display: flex; flex-direction: column; gap: 16px;
    }

    .login-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 8px;
    }

    .login-header img {
      width: 40px; height: auto; object-fit: contain;
    }

    .login-header span {
      font-weight: 700; font-size: 16px;
      letter-spacing: -0.01em; color: var(--text);
    }

    .login-box input {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text); font-family: 'Jost', sans-serif;
      font-size: 13px; padding: 10px 14px;
      outline: none; width: 100%;
      transition: border-color 0.2s;
    }

    .login-box input:focus { border-color: rgba(242,200,0,0.4); }
    .login-box input::placeholder { color: var(--muted); }

    .login-btn {
      background: var(--yellow); color: var(--dark);
      border: none; cursor: pointer; padding: 12px;
      font-family: 'Jost', sans-serif; font-weight: 700;
      font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
      transition: opacity 0.2s;
    }

    .login-btn:hover { opacity: 0.85; }
    .login-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .err-msg { color: var(--red); font-size: 12px; min-height: 16px; }

    /* ── ADMIN SHELL ───────────────────────────────────────────────── */
    #adminUI { display: none; }

    /* top bar */
    .admin-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--bar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 24px; gap: 32px;
    }

    .admin-logo {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 14px; letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .admin-logo img {
      width: 36px; height: auto; object-fit: contain;
    }

    .admin-tabs { display: flex; gap: 4px; flex: 1; }

    .tab-btn {
      background: none; border: none; cursor: pointer;
      font-family: 'Jost', sans-serif; font-weight: 600;
      font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); padding: 8px 16px;
      transition: color 0.2s, background 0.2s;
    }

    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--dark); background: var(--yellow); }

    .logout-btn {
      background: none; border: 1px solid var(--border);
      color: var(--muted); cursor: pointer;
      font-family: 'Jost', sans-serif; font-weight: 600;
      font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 6px 14px; transition: all 0.2s; margin-left: auto;
    }

    .logout-btn:hover { border-color: var(--red); color: var(--red); }

    /* save bar */
    .save-bar {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 90;
      background: var(--yellow); color: var(--dark);
      padding: 12px 24px;
      display: none; align-items: center; justify-content: space-between;
    }

    .save-bar.visible { display: flex; }

    .save-bar-msg {
      font-weight: 600; font-size: 12px; letter-spacing: 0.06em;
    }

    .save-bar-actions { display: flex; gap: 12px; }

    .save-publish-btn {
      background: var(--dark); color: var(--yellow);
      border: none; cursor: pointer;
      font-family: 'Jost', sans-serif; font-weight: 700;
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 8px 20px; transition: opacity 0.2s;
    }

    .save-publish-btn:hover { opacity: 0.8; }

    .discard-btn {
      background: none; border: 1px solid rgba(13,13,26,0.3);
      color: var(--dark); cursor: pointer;
      font-family: 'Jost', sans-serif; font-weight: 600;
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 8px 16px; transition: opacity 0.2s;
    }

    .discard-btn:hover { opacity: 0.6; }

    /* ── TAB PANEL ─────────────────────────────────────────────────── */
    .tab-panel {
      padding: calc(var(--bar-h) + 24px) 24px 80px;
    }

    /* panel header */
    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }

    .panel-stats {
      display: flex; gap: 24px;
    }

    .stat {
      display: flex; flex-direction: column; gap: 2px;
    }

    .stat-val {
      font-weight: 700; font-size: 22px; color: var(--yellow);
      line-height: 1;
    }

    .stat-label {
      font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted);
    }

    .add-btn {
      background: var(--yellow); color: var(--dark);
      border: none; cursor: pointer;
      font-family: 'Jost', sans-serif; font-weight: 700;
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 10px 20px; transition: opacity 0.2s;
    }

    .add-btn:hover { opacity: 0.85; }

    /* ── PROJECT / ITEM LIST ───────────────────────────────────────── */
    .list-header {
      display: grid;
      padding: 8px 12px;
      font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); border-bottom: 1px solid var(--border);
    }

    .list-header.projects-header {
      grid-template-columns: 28px 64px 1fr 110px 80px 80px 80px;
    }

    .list-header.shop-header {
      grid-template-columns: 28px 64px 1fr 80px 100px 80px 80px;
    }

    .item-row {
      display: grid;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      cursor: grab;
      transition: background 0.15s;
    }

    .item-row:hover { background: rgba(255,255,255,0.03); }
    .item-row.dragging { opacity: 0.4; }
    .item-row.drag-over { border-top: 2px solid var(--yellow); }

    .item-row.projects-row {
      grid-template-columns: 28px 64px 1fr 110px 80px 80px 80px;
    }

    .item-row.shop-row {
      grid-template-columns: 28px 64px 1fr 80px 100px 80px 80px;
    }

    .drag-handle {
      color: var(--muted); font-size: 16px; cursor: grab; user-select: none;
      padding: 4px;
    }

    .row-thumb {
      width: 56px; height: 42px; object-fit: cover; display: block;
      background: rgba(255,255,255,0.06);
    }

    .row-thumb-placeholder {
      width: 56px; height: 42px;
      background: rgba(255,255,255,0.06);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 18px;
    }

    .row-info { padding: 0 12px; min-width: 0; }

    .row-title {
      font-weight: 600; font-size: 13px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--text);
    }

    .row-sub {
      font-size: 11px; color: var(--muted); margin-top: 2px;
    }

    .cat-badge {
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
      font-weight: 600; padding: 3px 8px;
      background: rgba(255,255,255,0.08); color: var(--muted);
      display: inline-block; white-space: nowrap;
    }

    .cat-badge.art      { background: rgba(242,200,0,0.12); color: var(--yellow); }
    .cat-badge.videoart { background: rgba(204,24,24,0.12); color: #ff6b6b; }
    .cat-badge.events   { background: rgba(34,197,94,0.12); color: #4ade80; }

    /* toggle pills */
    .toggle-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: 1px solid var(--border);
      cursor: pointer; padding: 5px 10px;
      font-family: 'Jost', sans-serif; font-weight: 600;
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); transition: all 0.2s;
    }

    .toggle-pill:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }

    .toggle-pill.on.visible  { border-color: var(--green); color: var(--green); background: rgba(34,197,94,0.08); }
    .toggle-pill.on.featured { border-color: var(--yellow); color: var(--yellow); background: rgba(242,200,0,0.08); }

    /* row actions */
    .row-actions { display: flex; gap: 6px; }

    .row-btn {
      background: none; border: 1px solid var(--border); cursor: pointer;
      color: var(--muted); padding: 5px 10px; font-size: 12px;
      transition: all 0.2s; font-family: 'Jost', sans-serif;
    }

    .row-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
    .row-btn.delete:hover { color: var(--red); border-color: var(--red); }

    /* ── MODAL ─────────────────────────────────────────────────────── */
    #modalOverlay {
      display: none;
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.7);
      align-items: flex-start; justify-content: center;
      overflow-y: auto; padding: 40px 20px;
    }

    #modalOverlay.open { display: flex; }

    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      width: 100%; max-width: 680px;
      flex-shrink: 0;
    }

    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title { font-weight: 700; font-size: 15px; }

    .modal-close {
      background: none; border: 1px solid var(--border);
      color: var(--muted); cursor: pointer; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; transition: all 0.2s;
    }

    .modal-close:hover { color: var(--red); border-color: var(--red); }

    .modal-body { padding: 24px; display: flex; flex-direction: column; gap: 20px; }

    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; gap: 10px;
    }

    /* form fields */
    .field-group { display: flex; flex-direction: column; gap: 6px; }

    .field-group label {
      font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
      font-weight: 600; color: var(--muted);
    }

    .field-group input,
    .field-group select,
    .field-group textarea {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text); font-family: 'Jost', sans-serif; font-size: 13px;
      padding: 10px 14px; outline: none; width: 100%;
      transition: border-color 0.2s;
    }

    .field-group input:focus,
    .field-group select:focus,
    .field-group textarea:focus { border-color: rgba(242,200,0,0.4); }

    .field-group input::placeholder,
    .field-group textarea::placeholder { color: var(--muted); }

    .field-group select option { background: var(--surface); }

    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    /* radio tabs for hero type */
    .radio-tabs { display: flex; gap: 0; }

    .radio-tab {
      flex: 1; text-align: center;
      padding: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 12px; letter-spacing: 0.08em; font-weight: 600;
      text-transform: uppercase; color: var(--muted);
      transition: all 0.2s;
      border-right: none;
    }

    .radio-tab:last-child { border-right: 1px solid var(--border); }
    .radio-tab.active { background: rgba(242,200,0,0.12); color: var(--yellow); border-color: rgba(242,200,0,0.3); }

    /* upload area */
    .upload-zone {
      border: 1px dashed var(--border);
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    .upload-zone:hover { border-color: rgba(242,200,0,0.4); background: rgba(242,200,0,0.02); }

    .upload-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
      width: 100%; height: 100%;
    }

    .upload-zone-label { font-size: 12px; color: var(--muted); pointer-events: none; }
    .upload-zone-label strong { color: var(--yellow); }

    /* upload preview */
    .hero-preview {
      display: none;
      position: relative;
    }

    .hero-preview img, .hero-preview video {
      width: 100%; max-height: 240px; object-fit: cover; display: block;
    }

    .hero-preview-remove {
      position: absolute; top: 8px; right: 8px;
      background: rgba(0,0,0,0.7); border: 1px solid rgba(204,24,24,0.5);
      color: var(--red); cursor: pointer; padding: 4px 8px;
      font-size: 11px; font-family: 'Jost', sans-serif; font-weight: 600;
    }

    /* BTS photo grid */
    .bts-upload-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      min-height: 60px;
    }

    .bts-thumb-wrap {
      position: relative; aspect-ratio: 1;
    }

    .bts-thumb-wrap img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }

    .bts-remove {
      position: absolute; top: 4px; right: 4px;
      background: rgba(0,0,0,0.75); border: none;
      color: var(--red); cursor: pointer; width: 20px; height: 20px;
      font-size: 12px; display: flex; align-items: center; justify-content: center;
    }

    /* upload progress */
    .upload-progress {
      display: none; height: 3px; background: rgba(255,255,255,0.08);
    }

    .upload-progress-bar {
      height: 100%; background: var(--yellow); width: 0%;
      transition: width 0.2s;
    }

    /* checkboxes */
    .check-row { display: flex; gap: 24px; align-items: center; }

    .check-label {
      display: flex; align-items: center; gap: 8px; cursor: pointer;
      font-size: 12px; letter-spacing: 0.06em; font-weight: 600;
      color: var(--muted);
    }

    .check-label input[type="checkbox"] {
      width: 16px; height: 16px; cursor: pointer;
      accent-color: var(--yellow);
    }

    /* modal buttons */
    .btn-cancel {
      background: none; border: 1px solid var(--border);
      color: var(--muted); cursor: pointer; padding: 10px 20px;
      font-family: 'Jost', sans-serif; font-weight: 600;
      font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
      transition: all 0.2s;
    }

    .btn-cancel:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

    .btn-save {
      background: var(--yellow); color: var(--dark);
      border: none; cursor: pointer; padding: 10px 24px;
      font-family: 'Jost', sans-serif; font-weight: 700;
      font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
      transition: opacity 0.2s;
    }

    .btn-save:hover { opacity: 0.85; }
    .btn-save:disabled { opacity: 0.4; cursor: not-allowed; }

    /* category chip multi-select */
    .cat-chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 0; }
    .cat-chip {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--border); padding: 6px 12px; cursor: pointer;
      font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      font-weight: 600; color: var(--muted); transition: all 0.15s;
      user-select: none;
    }
    .cat-chip:hover { border-color: rgba(242,200,0,0.3); color: var(--text); }
    .cat-chip input[type="checkbox"] { display: none; }
    .cat-chip:has(input:checked) { background: rgba(242,200,0,0.12); border-color: rgba(242,200,0,0.5); color: var(--yellow); }

    /* BTS link list */
    .bts-link-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 0; border-bottom: 1px solid var(--border);
    }
    .bts-link-row input[type="url"],
    .bts-link-row input[type="text"] {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      color: var(--text); font-family: 'Jost', sans-serif; font-size: 12px;
      padding: 8px 10px; outline: none;
      transition: border-color 0.2s;
    }
    .bts-link-row input[type="url"]:focus,
    .bts-link-row input[type="text"]:focus { border-color: rgba(242,200,0,0.4); }
    .bts-link-row input[type="url"] { flex: 2; min-width: 0; }
    .bts-link-row input[type="text"] { flex: 1; min-width: 0; }
    .bts-link-remove {
      background: none; border: 1px solid var(--border); color: var(--muted);
      cursor: pointer; width: 28px; height: 28px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; transition: all 0.15s;
    }
    .bts-link-remove:hover { color: var(--red); border-color: var(--red); }
    .bts-link-drag { color: var(--muted); cursor: grab; padding: 4px; flex-shrink: 0; font-size: 14px; }
    .add-link-btn {
      margin-top: 10px; background: none; border: 1px dashed var(--border);
      color: var(--muted); cursor: pointer; padding: 8px 16px;
      font-family: 'Jost', sans-serif; font-weight: 600; font-size: 11px;
      letter-spacing: 0.08em; text-transform: uppercase; transition: all 0.15s; width: 100%;
    }
    .add-link-btn:hover { border-color: rgba(242,200,0,0.3); color: var(--yellow); }

    /* ── MISC ──────────────────────────────────────────────────────── */
    .empty-state {
      text-align: center; padding: 80px 20px;
      color: var(--muted); font-size: 13px; letter-spacing: 0.04em;
    }

    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(242,200,0,0.3);
      border-top-color: var(--yellow);
      border-radius: 50%; animation: spin 0.6s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- ── LOGIN ──────────────────────────────────────────────────────── -->
  <div id="loginScreen">
    <div class="login-box">
      <div class="login-header">
        <img src="assets/g-logo.png" alt="G">
        <span>6rac13 Admin</span>
      </div>
      <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
      <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password">
      <button class="login-btn" id="loginBtn">Sign In</button>
      <p class="err-msg" id="loginErr"></p>
    </div>
  </div>

  <!-- ── ADMIN UI ────────────────────────────────────────────────────── -->
  <div id="adminUI">

    <!-- top bar -->
    <header class="admin-bar">
      <div class="admin-logo">
        <img src="assets/g-logo.png" alt="G">
        6rac13 Admin
      </div>
      <div class="admin-tabs">
        <button class="tab-btn active" data-tab="projects" id="tabBtnProjects">Projects</button>
        <button class="tab-btn" data-tab="shop" id="tabBtnShop">Shop</button>
      </div>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </header>

    <!-- ── PROJECTS TAB ──────────────────────────────────────────────── -->
    <div class="tab-panel" id="tabProjects">
      <div class="panel-header">
        <div class="panel-stats" id="projStats">
          <div class="stat"><span class="stat-val" id="statTotal">—</span><span class="stat-label">Total</span></div>
          <div class="stat"><span class="stat-val" id="statVisible">—</span><span class="stat-label">Visible</span></div>
          <div class="stat"><span class="stat-val" id="statFeatured">—</span><span class="stat-label">Featured</span></div>
          <div class="stat"><span class="stat-val" id="statHidden">—</span><span class="stat-label">Hidden</span></div>
        </div>
        <button class="add-btn" id="addProjectBtn">+ Add Project</button>
      </div>

      <div class="list-header projects-header">
        <span></span>
        <span>Image</span>
        <span>Title</span>
        <span>Category</span>
        <span>Featured</span>
        <span>Visible</span>
        <span>Actions</span>
      </div>

      <div id="projectList"></div>
    </div>

    <!-- ── SHOP TAB ──────────────────────────────────────────────────── -->
    <div class="tab-panel" id="tabShop" style="display:none">
      <div class="panel-header">
        <div class="panel-stats">
          <div class="stat"><span class="stat-val" id="statShopTotal">—</span><span class="stat-label">Total</span></div>
          <div class="stat"><span class="stat-val" id="statShopVisible">—</span><span class="stat-label">Visible</span></div>
          <div class="stat"><span class="stat-val" id="statShopHidden">—</span><span class="stat-label">Hidden</span></div>
        </div>
        <button class="add-btn" id="addShopBtn">+ Add Item</button>
      </div>

      <div class="list-header shop-header">
        <span></span>
        <span>Image</span>
        <span>Title</span>
        <span>Price</span>
        <span>Platform</span>
        <span>Visible</span>
        <span>Actions</span>
      </div>

      <div id="shopList"></div>
    </div>

    <!-- save bar -->
    <div class="save-bar" id="saveBar">
      <span class="save-bar-msg">You have unsaved changes</span>
      <div class="save-bar-actions">
        <button class="discard-btn" id="discardBtn">Discard</button>
        <button class="save-publish-btn" id="savePublishBtn">Save &amp; Publish</button>
      </div>
    </div>

  </div><!-- /adminUI -->

  <!-- ── MODAL ──────────────────────────────────────────────────────── -->
  <div id="modalOverlay">
    <div class="modal-box" id="modalBox">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Add Project</span>
        <button class="modal-close" id="modalClose">✕</button>
      </div>

      <!-- PROJECT FORM -->
      <div class="modal-body" id="projectForm" style="display:none">
        <div class="field-group">
          <label>Title</label>
          <input type="text" id="fTitle" placeholder="Project title">
        </div>

          <div class="field-group">

            <div class="cat-chips" id="fCategoryChips">

              <label class="cat-chip"><input type="checkbox" value="portraits"> Portraits</label>
              <label class="cat-chip"><input type="checkbox" value="videoart"> Video Art</label>
              <label class="cat-chip"><input type="checkbox" value="events"> Events</label>
            </div>
          </div>
          <div class="field-group">
            <label>Hero Type</label>
            <div class="radio-tabs">

        <div class="field-group">

          <div class="hero-preview" id="heroPrev">

      <!-- SHOP ITEM FORM -->
      <div class="modal-body" id="shopForm" style="display:none">
        <div class="field-group">
          <label>Title</label>
          <input type="text" id="sTitle" placeholder="Item title">
        </div>

        <div class="field-group">
          <label>Description</label>
          <textarea id="sDesc" rows="3" placeholder="Short description…"></textarea>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label>Price</label>
            <input type="text" id="sPrice" placeholder="$35">
          </div>
          <div class="field-group">
            <label>Category</label>
            <select id="sCategory">
              <option value="Prints">Prints</option>
              <option value="Lighters">Lighters</option>
              <option value="Stickers">Stickers</option>
              <option value="Shirts">Shirts</option>
              <option value="Zines">Zines</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label>Platform</label>
            <select id="sPlatform">
              <option value="Blurb">Blurb</option>
              <option value="Etsy">Etsy</option>
              <option value="Society6">Society6</option>
              <option value="Shopify">Shopify</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="field-group">
            <label>External Checkout URL</label>
            <input type="url" id="sUrl" placeholder="https://blurb.com/…">
          </div>

        <div class="field-group">
          <label>Product Image</label>
          <div class="hero-preview" id="shopImgPrev">
            <div id="shopImgPrevMedia"></div>
            <button class="hero-preview-remove" id="shopImgRemoveBtn">Remove</button>
          </div>
          <div class="upload-zone">
            <input type="file" id="sImgFile" accept="image/*">
            <p class="upload-zone-label"><strong>Click to upload</strong> — product photo</p>
          </div>
          <div class="upload-progress" id="shopImgProgress">
            <div class="upload-progress-bar" id="shopImgProgressBar"></div>
          </div>
        </div>

        <div class="check-row">
          <label class="check-label">
            <input type="checkbox" id="sVisible" checked> Visible in shop
          </label>

      <div class="modal-footer">
        <button class="btn-cancel" id="modalCancel">Cancel</button>
        <button class="btn-save" id="modalSave">Save</button>
      </div>
    </div>
  </div>

  <!-- ── FIREBASE ────────────────────────────────────────────────────── -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

  <script>
  // ─── FIREBASE INIT ────────────────────────────────────────────────────
  const firebaseConfig = {
    apiKey:            "AIzaSyDmNYdW7lFABFWjA_eSEDqmd2YuOrX32g8",
    authDomain:        "rac13-12cca.firebaseapp.com",
    databaseURL:       "https://rac13-12cca-default-rtdb.firebaseio.com",
    projectId:         "rac13-12cca",
    storageBucket:     "rac13-12cca.firebasestorage.app",
    messagingSenderId: "761534687296",
    appId:             "1:761534687296:web:04fef318d00c1f7b0457a5"
  };

  firebase.initializeApp(firebaseConfig);
  const auth    = firebase.auth();
  const db      = firebase.database();
  const storage = firebase.storage();

  // ─── STATE ────────────────────────────────────────────────────────────
  let projectsMap   = {};  // { id: projectObj }
  let shopMap       = {};  // { id: shopItemObj }
  let projDirty     = false;
  let shopDirty     = false;
  let activeTab     = 'projects';
  let editingId     = null;   // null = new
  let editingType   = null;   // 'project' | 'shop'
  let heroUrl       = '';
  let heroType      = 'image';
  let btsLinks      = [];     // [{ url, label }]
  let shopImgUrl    = '';

  // dragging
  let dragSrc = null;

  const CAT_LABELS = { art: 'Art', portraits: 'Portraits', videoart: 'Video Art', events: 'Events' };

  /* Transparent migration: old single string → array */
  function getCategories(p) {
    if (Array.isArray(p.categories) && p.categories.length) return p.categories;
    if (p.category) return [p.category];
    return ['art'];
  }

  // ─── AUTH ─────────────────────────────────────────────────────────────
  auth.onAuthStateChanged(user => {
    if (user) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminUI').style.display     = 'block';
      loadProjects();
      loadShopItems();
    } else {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('adminUI').style.display     = 'none';
    }
  });

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const pass  = document.getElementById('loginPass').value;
    const btn   = document.getElementById('loginBtn');
    const err   = document.getElementById('loginErr');

    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    try {
      await auth.signInWithEmailAndPassword(email, pass);
    } catch (e) {
      err.textContent = e.message;
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });

  document.getElementById('loginPass').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });

  document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());

  // ─── TABS ─────────────────────────────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
      document.getElementById('tabProjects').style.display = activeTab === 'projects' ? 'block' : 'none';
      document.getElementById('tabShop').style.display     = activeTab === 'shop'     ? 'block' : 'none';
      updateSaveBar();
    });
  });

  // ─── DIRTY / SAVE BAR ────────────────────────────────────────────────
  function markDirty() {
    if (activeTab === 'projects') projDirty = true;
    else shopDirty = true;
    updateSaveBar();
  }

  function updateSaveBar() {
    const dirty = activeTab === 'projects' ? projDirty : shopDirty;
    document.getElementById('saveBar').classList.toggle('visible', dirty);
  }

  document.getElementById('savePublishBtn').addEventListener('click', async () => {
    const btn = document.getElementById('savePublishBtn');
    btn.innerHTML = '<span class="spinner"></span>Publishing…';
    btn.disabled = true;

    try {
      if (activeTab === 'projects') {
        await db.ref('projects').set(projectsMap);
        projDirty = false;
      } else {
        await db.ref('shopItems').set(shopMap);
        shopDirty = false;
      }
      updateSaveBar();
    } catch(e) {
      alert('Save failed: ' + e.message);
    }

    btn.innerHTML = 'Save &amp; Publish';
    btn.disabled = false;
  });

  document.getElementById('discardBtn').addEventListener('click', () => {
    if (activeTab === 'projects') { loadProjects(); projDirty = false; }
    else                          { loadShopItems(); shopDirty = false; }
    updateSaveBar();
  });

  // ─── LOAD PROJECTS ───────────────────────────────────────────────────
  function loadProjects() {
    db.ref('projects').orderByChild('order').once('value', snap => {
      projectsMap = {};
      snap.forEach(child => {
        projectsMap[child.key] = { ...child.val(), id: child.key };
      });
      renderProjectList();
    });
  }

  function renderProjectList() {
    const list = document.getElementById('projectList');
    const items = Object.values(projectsMap).sort((a,b) => (a.order||0) - (b.order||0));

    if (items.length === 0) {
      list.innerHTML = `<div class="empty-state">No projects yet — add your first one.</div>`;
      updateProjStats(items);
      return;
    }

    list.innerHTML = items.map(p => projRowHTML(p)).join('');
    attachRowEvents('projects');
    updateProjStats(items);
  }

  function projRowHTML(p) {
    const cats = getCategories(p);
    const thumb = p.heroUrl
      ? `<img class="row-thumb" src="${p.heroUrl}" alt="" loading="lazy">`
      : `<div class="row-thumb-placeholder">🖼</div>`;
    const catBadges = cats.map(c => `<span class="cat-badge ${c}">${CAT_LABELS[c] || c}</span>`).join(' ');

    return `
      <div class="item-row projects-row" draggable="true" data-id="${p.id}">
        <span class="drag-handle">⠿</span>
        ${thumb}
        <div class="row-info">
          <div class="row-title">${p.title || 'Untitled'}</div>
          <div class="row-sub">${p.heroType === 'video' ? 'Video' : 'Image'}</div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:4px">${catBadges}</div>
        <button class="toggle-pill featured ${p.featured ? 'on' : ''}" data-id="${p.id}" data-field="featured">
          ${p.featured ? '★ On' : '☆ Off'}
        </button>
        <button class="toggle-pill visible ${p.visible ? 'on' : ''}" data-id="${p.id}" data-field="visible">
          ${p.visible ? '● On' : '○ Off'}
        </button>
        <div class="row-actions">
          <button class="row-btn edit-btn" data-id="${p.id}">Edit</button>
          <button class="row-btn delete row-btn-delete" data-id="${p.id}">Del</button>
        </div>
      </div>`;
  }

  function updateProjStats(items) {
    document.getElementById('statTotal').textContent    = items.length;
    document.getElementById('statVisible').textContent  = items.filter(p => p.visible).length;
    document.getElementById('statFeatured').textContent = items.filter(p => p.featured).length;
    document.getElementById('statHidden').textContent   = items.filter(p => !p.visible).length;
  }

  // ─── LOAD SHOP ───────────────────────────────────────────────────────
  function loadShopItems() {
    db.ref('shopItems').orderByChild('order').once('value', snap => {
      shopMap = {};
      snap.forEach(child => {
        shopMap[child.key] = { ...child.val(), id: child.key };
      });
      renderShopList();
    });
  }

  function renderShopList() {
    const list  = document.getElementById('shopList');
    const items = Object.values(shopMap).sort((a,b) => (a.order||0) - (b.order||0));

    if (items.length === 0) {
      list.innerHTML = `<div class="empty-state">No shop items yet — add your first one.</div>`;
      updateShopStats(items);
      return;
    }

    list.innerHTML = items.map(s => shopRowHTML(s)).join('');
    attachRowEvents('shop');
    updateShopStats(items);
  }

  function shopRowHTML(s) {
    const thumb = s.imageUrl
      ? `<img class="row-thumb" src="${s.imageUrl}" alt="" loading="lazy">`
      : `<div class="row-thumb-placeholder">🛒</div>`;

    return `
      <div class="item-row shop-row" draggable="true" data-id="${s.id}">
        <span class="drag-handle">⠿</span>
        ${thumb}
        <div class="row-info">
          <div class="row-title">${s.title || 'Untitled'}</div>
          <div class="row-sub">${s.category || ''}</div>
        </div>
        <span class="row-sub">${s.price || '—'}</span>
        <span class="cat-badge">${s.platform || '—'}</span>
        <button class="toggle-pill visible ${s.visible ? 'on' : ''}" data-id="${s.id}" data-field="visible">
          ${s.visible ? '● On' : '○ Off'}
        </button>
        <div class="row-actions">
          <button class="row-btn edit-btn" data-id="${s.id}">Edit</button>
          <button class="row-btn delete row-btn-delete" data-id="${s.id}">Del</button>
        </div>
      </div>`;
  }

  function updateShopStats(items) {
    document.getElementById('statShopTotal').textContent   = items.length;
    document.getElementById('statShopVisible').textContent = items.filter(s => s.visible).length;
    document.getElementById('statShopHidden').textContent  = items.filter(s => !s.visible).length;
  }

  // ─── ROW EVENTS (toggles, edit, delete, drag) ────────────────────────
  function attachRowEvents(type) {
    const listId = type === 'projects' ? 'projectList' : 'shopList';
    const list   = document.getElementById(listId);
    const map    = type === 'projects' ? projectsMap : shopMap;

    // toggle pills
    list.querySelectorAll('.toggle-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        const id    = btn.dataset.id;
        const field = btn.dataset.field;
        map[id][field] = !map[id][field];
        markDirty();
        if (type === 'projects') renderProjectList();
        else renderShopList();
      });
    });

    // edit
    list.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        openModal(type === 'projects' ? 'project' : 'shop', btn.dataset.id);
      });
    });

    // delete
    list.querySelectorAll('.row-btn-delete').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const label = type === 'projects'
          ? (map[id]?.title || 'this project')
          : (map[id]?.title || 'this item');

        if (!confirm(`Delete "${label}"? This cannot be undone.`)) return;

        const ref = type === 'projects'
          ? db.ref(`projects/${id}`)
          : db.ref(`shopItems/${id}`);

        await ref.remove();
        if (type === 'projects') loadProjects();
        else loadShopItems();
      });
    });

    // drag-and-drop reorder
    list.querySelectorAll('.item-row').forEach(row => {
      row.addEventListener('dragstart', e => {
        dragSrc = row;
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });

      row.addEventListener('dragend', () => {
        row.classList.remove('dragging');
        list.querySelectorAll('.drag-over').forEach(r => r.classList.remove('drag-over'));
      });

      row.addEventListener('dragover', e => {
        e.preventDefault();
        if (row !== dragSrc) {
          list.querySelectorAll('.drag-over').forEach(r => r.classList.remove('drag-over'));
          row.classList.add('drag-over');
        }
      });

      row.addEventListener('drop', e => {
        e.preventDefault();
        if (!dragSrc || dragSrc === row) return;

        const rows = [...list.querySelectorAll('.item-row')];
        const srcIdx = rows.indexOf(dragSrc);
        const tgtIdx = rows.indexOf(row);

        if (srcIdx < tgtIdx) row.after(dragSrc);
        else row.before(dragSrc);

        // update order in map
        [...list.querySelectorAll('.item-row')].forEach((r, i) => {
          const id = r.dataset.id;
          if (map[id]) map[id].order = i;
        });

        markDirty();
        row.classList.remove('drag-over');
      });
    });
  }

  // ─── ADD BUTTONS ─────────────────────────────────────────────────────
  document.getElementById('addProjectBtn').addEventListener('click', () => openModal('project', null));
  document.getElementById('addShopBtn').addEventListener('click', () => openModal('shop', null));

  // ─── MODAL ───────────────────────────────────────────────────────────
  function openModal(type, id) {
    editingId   = id;
    editingType = type;
    heroUrl     = '';
    shopImgUrl  = '';
    btsLinks    = [];
    heroType    = 'image';

    const overlay = document.getElementById('modalOverlay');
    overlay.classList.add('open');

    if (type === 'project') {
      document.getElementById('projectForm').style.display = 'flex';
      document.getElementById('shopForm').style.display    = 'none';
      document.getElementById('modalTitle').textContent    = id ? 'Edit Project' : 'Add Project';

      // reset
      setHeroType('image');
      document.getElementById('heroPrev').style.display       = 'none';
      document.getElementById('heroUploadZone').style.display = 'block';
      document.getElementById('btsLinksList').innerHTML       = '';
      document.getElementById('fFeatured').checked            = false;
      document.getElementById('fVisible').checked             = true;
      /* reset all category chips */
      document.querySelectorAll('#fCategoryChips input').forEach(cb => cb.checked = false);

      if (id) {
        const p = projectsMap[id];
        document.getElementById('fTitle').value      = p.title || '';
        document.getElementById('fDesc').value       = p.description || '';
        document.getElementById('fFeatured').checked = !!p.featured;
        document.getElementById('fVisible').checked  = p.visible !== false;
        heroType = p.heroType || 'image';
        setHeroType(heroType);

        /* load categories (backwards-compatible) */
        const cats = getCategories(p);
        document.querySelectorAll('#fCategoryChips input').forEach(cb => {
          cb.checked = cats.includes(cb.value);
        });

        if (p.heroUrl) {
          heroUrl = p.heroUrl;
          showHeroPreview(p.heroUrl, p.heroType === 'video');
        }

        /* load bts links */
        btsLinks = Array.isArray(p.btsLinks) ? [...p.btsLinks] : [];
        renderBtsLinks();
      } else {
        document.getElementById('fTitle').value = '';
        document.getElementById('fDesc').value  = '';
        renderBtsLinks();
      }

    } else {
      document.getElementById('projectForm').style.display = 'none';
      document.getElementById('shopForm').style.display    = 'flex';
      document.getElementById('modalTitle').textContent    = id ? 'Edit Item' : 'Add Shop Item';

      document.getElementById('shopImgPrev').style.display = 'none';
      document.getElementById('sVisible').checked          = true;

      if (id) {
        const s = shopMap[id];
        document.getElementById('sTitle').value     = s.title || '';
        document.getElementById('sDesc').value      = s.description || '';
        document.getElementById('sPrice').value     = s.price || '';
        document.getElementById('sCategory').value  = s.category || 'Prints';
        document.getElementById('sPlatform').value  = s.platform || 'Blurb';
        document.getElementById('sUrl').value       = s.externalUrl || '';
        document.getElementById('sVisible').checked = s.visible !== false;

        if (s.imageUrl) {
          shopImgUrl = s.imageUrl;
          showShopImgPreview(s.imageUrl);
        }
      } else {
        document.getElementById('sTitle').value    = '';
        document.getElementById('sDesc').value     = '';
        document.getElementById('sPrice').value    = '';
        document.getElementById('sUrl').value      = '';
      }
    }
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    editingId = null; editingType = null;
  }

  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  });

  // hero type toggle
  function setHeroType(type) {
    heroType = type;
    document.getElementById('heroTypeImage').classList.toggle('active', type === 'image');
    document.getElementById('heroTypeVideo').classList.toggle('active', type === 'video');
  }

  document.getElementById('heroTypeImage').addEventListener('click', () => setHeroType('image'));
  document.getElementById('heroTypeVideo').addEventListener('click', () => setHeroType('video'));

  // hero preview helpers
  function showHeroPreview(url, isVideo) {
    const prev = document.getElementById('heroPrev');
    const media = document.getElementById('heroPrevMedia');
    media.innerHTML = isVideo
      ? `<video src="${url}" controls style="width:100%;max-height:240px;object-fit:cover"></video>`
      : `<img src="${url}" style="width:100%;max-height:240px;object-fit:cover">`;
    prev.style.display = 'block';
    document.getElementById('heroUploadZone').style.display = 'none';
  }

  document.getElementById('heroRemoveBtn').addEventListener('click', () => {
    heroUrl = '';
    document.getElementById('heroPrev').style.display       = 'none';
    document.getElementById('heroUploadZone').style.display = 'block';
    document.getElementById('heroPrevMedia').innerHTML      = '';
  });

  // hero file upload
  document.getElementById('heroFile').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;

    const isVideo = file.type.startsWith('video/');
    const tmpId   = editingId || `tmp_${Date.now()}`;
    const ext     = file.name.split('.').pop();
    const path    = `projects/${tmpId}/hero.${ext}`;
    const ref     = storage.ref(path);
    const task    = ref.put(file);

    const prog    = document.getElementById('heroProgress');
    const bar     = document.getElementById('heroProgressBar');
    prog.style.display = 'block';

    task.on('state_changed',
      snap => { bar.style.width = (snap.bytesTransferred / snap.totalBytes * 100) + '%'; },
      err  => { alert('Upload failed: ' + err.message); prog.style.display = 'none'; },
      async () => {
        heroUrl = await ref.getDownloadURL();
        prog.style.display = 'none';
        setHeroType(isVideo ? 'video' : 'image');
        showHeroPreview(heroUrl, isVideo);
      }
    );
  });

  // BTS link management
  function renderBtsLinks() {
    const list = document.getElementById('btsLinksList');
    list.innerHTML = '';
    btsLinks.forEach((lk, i) => {
      const row = document.createElement('div');
      row.className = 'bts-link-row';
      row.draggable = true;
      row.dataset.idx = i;
      row.innerHTML = `
        <span class="bts-link-drag">⠿</span>
        <input type="url" placeholder="https://youtube.com/…" value="${lk.url || ''}" data-field="url" data-idx="${i}">
        <input type="text" placeholder="Label (optional)" value="${lk.label || ''}" data-field="label" data-idx="${i}">
        <button class="bts-link-remove" data-idx="${i}">✕</button>`;
      list.appendChild(row);
    });

    list.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', () => {
        const idx = +inp.dataset.idx;
        btsLinks[idx][inp.dataset.field] = inp.value;
      });
    });

    list.querySelectorAll('.bts-link-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        btsLinks.splice(+btn.dataset.idx, 1);
        renderBtsLinks();
      });
    });

    /* drag-to-reorder within links list */
    let lkDragSrc = null;
    list.querySelectorAll('.bts-link-row').forEach(row => {
      row.addEventListener('dragstart', e => { lkDragSrc = row; e.dataTransfer.effectAllowed = 'move'; });
      row.addEventListener('dragover', e => { e.preventDefault(); });
      row.addEventListener('drop', e => {
        e.preventDefault();
        if (!lkDragSrc || lkDragSrc === row) return;
        const srcIdx = +lkDragSrc.dataset.idx;
        const tgtIdx = +row.dataset.idx;
        const [moved] = btsLinks.splice(srcIdx, 1);
        btsLinks.splice(tgtIdx, 0, moved);
        renderBtsLinks();
      });
    });
  }

  document.getElementById('addBtsLink').addEventListener('click', () => {
    btsLinks.push({ url: '', label: '' });
    renderBtsLinks();
  });

  // shop image preview
  function showShopImgPreview(url) {
    const prev  = document.getElementById('shopImgPrev');
    const media = document.getElementById('shopImgPrevMedia');
    media.innerHTML = `<img src="${url}" style="width:100%;max-height:240px;object-fit:cover">`;
    prev.style.display = 'block';
  }

  document.getElementById('shopImgRemoveBtn').addEventListener('click', () => {
    shopImgUrl = '';
    document.getElementById('shopImgPrev').style.display = 'none';
    document.getElementById('shopImgPrevMedia').innerHTML = '';
  });

  document.getElementById('sImgFile').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;

    const tmpId = editingId || `tmp_${Date.now()}`;
    const path  = `shop/${tmpId}/image.${file.name.split('.').pop()}`;
    const ref   = storage.ref(path);
    const task  = ref.put(file);

    const prog = document.getElementById('shopImgProgress');
    const bar  = document.getElementById('shopImgProgressBar');
    prog.style.display = 'block';

    task.on('state_changed',
      snap => { bar.style.width = (snap.bytesTransferred / snap.totalBytes * 100) + '%'; },
      err  => { alert('Upload failed: ' + err.message); prog.style.display = 'none'; },
      async () => {
        shopImgUrl = await ref.getDownloadURL();
        prog.style.display = 'none';
        showShopImgPreview(shopImgUrl);
      }
    );
  });

  // ─── MODAL SAVE ──────────────────────────────────────────────────────
  document.getElementById('modalSave').addEventListener('click', async () => {
    const btn = document.getElementById('modalSave');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      if (editingType === 'project') await saveProject();
      else await saveShopItem();
      closeModal();
    } catch(e) {
      alert('Error: ' + e.message);
    }

    btn.disabled = false;
    btn.textContent = 'Save';
  });

  async function saveProject() {
    const title    = document.getElementById('fTitle').value.trim();
    const desc     = document.getElementById('fDesc').value.trim();
    const featured = document.getElementById('fFeatured').checked;
    const visible  = document.getElementById('fVisible').checked;

    const categories = [...document.querySelectorAll('#fCategoryChips input:checked')].map(cb => cb.value);
    if (!title) { alert('Please enter a title.'); throw new Error('No title'); }
    if (!categories.length) { alert('Please select at least one category.'); throw new Error('No category'); }

    const validLinks = btsLinks.filter(lk => lk.url && lk.url.trim());

    const data = { title, categories, description: desc, heroType, heroUrl,
                   btsLinks: validLinks, featured, visible, addedAt: Date.now() };

    const items = Object.values(projectsMap).sort((a,b) => (a.order||0) - (b.order||0));

    if (editingId) {
      data.order = projectsMap[editingId].order ?? items.length;
      await db.ref(`projects/${editingId}`).update(data);
    } else {
      data.order = items.length;
      await db.ref('projects').push(data);
    }

    projDirty = false;
    loadProjects();
    updateSaveBar();
  }

  async function saveShopItem() {
    const title      = document.getElementById('sTitle').value.trim();
    const desc       = document.getElementById('sDesc').value.trim();
    const price      = document.getElementById('sPrice').value.trim();
    const category   = document.getElementById('sCategory').value;
    const platform   = document.getElementById('sPlatform').value;
    const externalUrl= document.getElementById('sUrl').value.trim();
    const visible    = document.getElementById('sVisible').checked;

    if (!title) { alert('Please enter a title.'); throw new Error('No title'); }

    const items = Object.values(shopMap).sort((a,b) => (a.order||0) - (b.order||0));
    const data  = { title, description: desc, price, category, platform,
                    externalUrl, imageUrl: shopImgUrl, visible };

    if (editingId) {
      data.order = shopMap[editingId].order ?? items.length;
      await db.ref(`shopItems/${editingId}`).update(data);
    } else {
      data.order = items.length;
      await db.ref('shopItems').push(data);
    }

    shopDirty = false;
    loadShopItems();
    updateSaveBar();
  }
  </script>
</body>
</html>
