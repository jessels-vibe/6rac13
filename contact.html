<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Contact — 6rac13</title>
  <link rel="icon" href="assets/g-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Amoresa Aged';
      src: url('assets/fonts/AmorosaAged.otf') format('opentype');
      font-weight: normal; font-style: normal;
    }
    :root {
      --blue:   #1800AD;
      --yellow: #FFEF5E;
      --dark:   #28283A;
      --red:    #CC1818;
      --cream:  #F0E4C4;
      --nav-h:  80px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--blue);
      color: var(--yellow);
      font-family: 'Jost', sans-serif;
      min-height: 100vh;
    }

    /* ── NAV ─────────────────────────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0; z-index: 200;
      height: var(--nav-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px;
      background: var(--blue);
      transition: box-shadow 0.3s;
    }

    nav.scrolled { box-shadow: 0 1px 0 rgba(255,239,94,0.12); }

    .nav-logo { display: flex; align-items: center; text-decoration: none; }
    .nav-logo img { height: 62px; width: auto; object-fit: contain; display: block; }

    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a {
      color: var(--yellow); text-decoration: none;
      font-family: 'Jost', sans-serif; font-weight: 700;
      font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .nav-links a:hover { opacity: 0.6; }
    .nav-links a.active { border-bottom: 1px solid var(--yellow); }

    .nav-dropdown-wrap { position: relative; }
    .dropdown-toggle {
      cursor: pointer; background: none; border: none; padding: 0;
      color: var(--yellow); font-family: 'Jost', sans-serif; font-weight: 700;
      font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .dropdown-toggle:hover { opacity: 0.6; }
    .dropdown-toggle.active { border-bottom: 1px solid var(--yellow); }
    .nav-dropdown {
      position: absolute; top: calc(100% + 12px); left: -16px;
      background: var(--blue); border: 1px solid rgba(255,239,94,0.25);
      min-width: 160px; display: none; flex-direction: column; z-index: 300;
    }
    .nav-dropdown-wrap.open .nav-dropdown { display: flex; }
    .nav-dropdown a {
      padding: 12px 20px; color: rgba(255,239,94,0.75); text-decoration: none;
      font-family: 'Jost', sans-serif; font-weight: 600; font-size: 11px;
      letter-spacing: 0.14em; text-transform: uppercase; transition: color 0.15s;
      border-left: 2px solid transparent;
    }
    .nav-dropdown a:hover { color: var(--yellow); border-left-color: var(--yellow); background: rgba(255,239,94,0.04); }

    /* ── HAMBURGER ───────────────────────────────────────────────────── */
    .nav-burger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      color: var(--yellow);
      -webkit-tap-highlight-color: transparent;
    }

    /* ── MOBILE NAV OVERLAY ──────────────────────────────────────────── */
    .mobile-nav {
      position: fixed;
      inset: 0;
      z-index: 499;
      background: var(--blue);
      display: flex;
      flex-direction: column;
      padding: 0 32px 48px;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .mobile-nav.open { transform: translateX(0); }

    .mobile-nav-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--nav-h);
      flex-shrink: 0;
    }

    .mobile-nav-close {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      color: var(--yellow);
      -webkit-tap-highlight-color: transparent;
    }

    .mobile-nav-links { display: flex; flex-direction: column; padding-top: 12px; }

    .mobile-nav-link {
      font-family: 'Amoresa Aged', cursive;
      font-size: clamp(56px, 16vw, 80px);
      color: var(--yellow);
      text-decoration: none;
      line-height: 1;
      padding: 6px 0;
      transition: opacity 0.15s;
    }
    .mobile-nav-link:active { opacity: 0.6; }

    .mobile-nav-sub {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 16px;
      padding: 4px 0 20px 2px;
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(255,239,94,0.12);
    }
    .mobile-nav-sub a {
      font-family: 'Jost', sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,239,94,0.45);
      text-decoration: none;
      padding: 8px 0;
      display: inline-block;
    }

    /* ── PAGE HEADER ─────────────────────────────────────────────────── */
    .page-header {
      padding: calc(var(--nav-h) + 8px) 28px 0;
      display: flex; flex-direction: column; justify-content: flex-start;
    }

    .header-label {
      font-family: 'Jost', sans-serif; font-weight: 700; font-size: 11px;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(255,239,94,0.4); margin-bottom: 4px;
    }

    .header-title {
      font-family: 'Amoresa Aged', cursive;
      font-size: clamp(72px, 13vw, 160px);
      color: var(--yellow); line-height: 0.85; margin-bottom: 16px; text-align: right;
      padding-top: 40px;
    }

    /* ── POSTCARD FOOTER ─────────────────────────────────────────────── */
    .postcard-footer { margin: 0 28px 40px; }
    .pc-wrap { position: relative; }
    .pc-bg { width: 100%; display: block; }
    .pc-form {
      position: absolute;
      left: 10%; right: 10.5%;
      top: 14%; bottom: 15%;
      display: flex;
      pointer-events: none;
    }
    .pc-form * { pointer-events: all; }
    .pc-msg {
      flex: 1;
      background: transparent;
      border: none;
      resize: none;
      font-family: 'Jost', sans-serif;
      font-weight: 700;
      font-size: clamp(13px, 1.6vw, 18px);
      color: #1800AD;
      outline: none;
      padding: 27% 6% 4% 11%;
      line-height: 1.5;
      overflow-y: auto;
      -webkit-touch-callout: none;
    }
    .pc-msg::placeholder { color: rgba(24,0,173,0.45); font-weight: 700; }
    .pc-char-count {
      position: absolute;
      bottom: 18%;
      left: 12%;
      font-family: 'Jost', sans-serif;
      font-size: clamp(9px, 1vw, 11px);
      color: rgba(24,0,173,0.35);
      pointer-events: none;
    }
    .pc-addr {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; padding: 8% 4% 21% 7%;
    }
    .pc-to {
      font-family: 'Jost', sans-serif;
      font-weight: 700;
      font-size: clamp(12px, 1.5vw, 20px);
      color: #1800AD;
      letter-spacing: 0.04em;
      padding-bottom: 2.5%;
      
    }
    .pc-row {
      display: flex;
      align-items: center;
      padding: 3.5% 0 1.5%;
      
      gap: 4px;
    }
    .pc-lbl {
      font-family: 'Jost', sans-serif;
      font-weight: 700;
      font-size: clamp(11px, 1.3vw, 17px);
      color: rgba(24,0,173,0.7);
      white-space: nowrap;
    }
    .pc-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #1800AD;
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: clamp(12px, 1.4vw, 18px);
      outline: none;
      min-width: 0;
    }
    .pc-input::placeholder { color: rgba(24,0,173,0.3); }
    .pc-addr > :nth-child(1) { margin-bottom: 5px; }
    .pc-addr > :nth-child(2) { margin-bottom: 5px; }
    .pc-addr > :nth-child(4) { margin-top: 10px; }
    .pc-send {
      margin-top: 2%;
      align-self: flex-end; margin-right: 70px;
      background: none;
      border: 1px solid rgba(120,100,70,0.5);
      color: #1800AD;
      font-family: 'Jost', sans-serif;
      font-weight: 700;
      font-size: clamp(11px, 1.2vw, 15px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .pc-send:hover { background: rgba(120,100,70,0.12); }
    .pc-send:disabled { opacity: 0.4; cursor: not-allowed; }
    .pc-sent {
      position: absolute;
      left: 10%; right: 10%;
      top: 40%;
      text-align: center;
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: clamp(15px, 1.8vw, 23px);
      color: #1800AD;
      letter-spacing: 0.08em;
    }

    /* ── RESPONSIVE ──────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      .nav-links { display: none; }
      .nav-burger { display: flex; align-items: center; justify-content: center; }
      body { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .postcard-footer { margin: 0 12px 40px; }
      .pc-msg { font-size: 16px; padding: 20% 8% 4% 8%; }
    }

    /* ── IMAGE PROTECTION ────────────────────────────────────────────── */
    img { -webkit-user-drag: none; user-select: none; -webkit-user-select: none; }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav id="mainNav">
    <a href="index.html" class="nav-logo">
      <img src="assets/g-logo.png" alt="6rac13">
    </a>
    <ul class="nav-links">
      <li class="nav-dropdown-wrap" id="workDropWrap">
        <button class="dropdown-toggle" id="workToggle">Work</button>
        <div class="nav-dropdown">
          <a href="index.html#work">All Work</a>
          <a href="index.html#work/art">Art</a>
          <a href="index.html#work/portraits">Portraits</a>
          <a href="index.html#work/videoart">Video Art</a>
          <a href="index.html#stopmotion">Stop Motion</a>
          <a href="index.html#work/events">Events</a>
        </div>
      </li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
    <button class="nav-burger" id="navBurger" aria-label="Open menu">
      <svg width="22" height="14" viewBox="0 0 22 14" fill="none">
        <rect width="22" height="2" fill="currentColor"/>
        <rect y="6" width="22" height="2" fill="currentColor"/>
        <rect y="12" width="22" height="2" fill="currentColor"/>
      </svg>
    </button>
  </nav>

  <!-- MOBILE NAV -->
  <div class="mobile-nav" id="mobileNav">
    <div class="mobile-nav-head">
      <a href="index.html" class="nav-logo"><img src="assets/g-logo.png" alt="6rac13"></a>
      <button class="mobile-nav-close" id="mobileNavClose" aria-label="Close menu">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <line x1="1" y1="1" x2="19" y2="19" stroke="currentColor" stroke-width="2.5"/>
          <line x1="19" y1="1" x2="1" y2="19" stroke="currentColor" stroke-width="2.5"/>
        </svg>
      </button>
    </div>
    <div class="mobile-nav-links">
      <a href="index.html#work" class="mobile-nav-link">Work</a>
      <div class="mobile-nav-sub">
        <a href="index.html#work">All Work</a>
        <a href="index.html#work/art">Art</a>
        <a href="index.html#work/portraits">Portraits</a>
        <a href="index.html#work/videoart">Video Art</a>
        <a href="index.html#stopmotion">Stop Motion</a>
        <a href="index.html#work/events">Events</a>
      </div>
      <a href="shop.html" class="mobile-nav-link">Shop</a>
      <a href="contact.html" class="mobile-nav-link">Contact</a>
    </div>
  </div>

  <!-- HEADER -->
  <header class="page-header">
    <p class="header-label">Get in Touch</p>
    <h1 class="header-title">Contact</h1>
  </header>

  <!-- POSTCARD FOOTER -->
  <footer class="postcard-footer">
    <div class="pc-wrap">
      <img src="assets/postcard.png" class="pc-bg" alt="">
      <form class="pc-form" id="pcForm" action="https://formspree.io/f/mwlpabqv" method="POST">
        <textarea class="pc-msg" id="pcMsg" name="message" placeholder="Write your message to Gracie…" maxlength="200"></textarea>
        <div class="pc-addr">
          <div class="pc-to">To: Gracie F. Vanderlaan</div>
          <div class="pc-row">
            <span class="pc-lbl">From:</span>
            <input class="pc-input" type="text" name="name" placeholder="Your name">
          </div>
          <div class="pc-row">
            <input class="pc-input" type="email" name="email" placeholder="your@email.com">
          </div>
          <div class="pc-row">
            <span class="pc-lbl">Subject:</span>
            <input class="pc-input" type="text" name="subject" placeholder="What's this about?">
          </div>
          <button class="pc-send" type="submit">Send →</button>
        </div>
      </form>
      <span class="pc-char-count" id="pcCharCount">0 / 200</span>
      <div class="pc-sent" id="pcSent" style="display:none">Message sent — Gracie will be in touch.</div>
    </div>
  </footer>

  <script>
    window.addEventListener('scroll', () => {
      document.getElementById('mainNav').classList.toggle('scrolled', window.scrollY > 10);
    });

    const workWrap = document.getElementById('workDropWrap');
    document.getElementById('workToggle').addEventListener('click', e => { e.preventDefault(); workWrap.classList.toggle('open'); });
    document.addEventListener('click', e => { if (!workWrap.contains(e.target)) workWrap.classList.remove('open'); });

    // Mobile nav
    const navBurger = document.getElementById('navBurger');
    const mobileNav = document.getElementById('mobileNav');
    const mobileNavClose = document.getElementById('mobileNavClose');
    if (navBurger && mobileNav) {
      navBurger.addEventListener('click', () => { mobileNav.classList.add('open'); document.body.style.overflow = 'hidden'; });
      mobileNavClose.addEventListener('click', () => { mobileNav.classList.remove('open'); document.body.style.overflow = ''; });
      mobileNav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => { mobileNav.classList.remove('open'); document.body.style.overflow = ''; }));
    }

    const pcMsg = document.getElementById('pcMsg');
    const pcCharCount = document.getElementById('pcCharCount');
    if (pcMsg) {
      pcMsg.addEventListener('input', () => { pcCharCount.textContent = `${pcMsg.value.length} / 200`; });
    }

    const pcForm = document.getElementById('pcForm');
    if (pcForm) {
      pcForm.addEventListener('submit', async e => {
        e.preventDefault();
        const btn = pcForm.querySelector('.pc-send');
        btn.disabled = true; btn.textContent = 'Sending…';
        try {
          const res = await fetch(pcForm.action, { method: 'POST', body: new FormData(pcForm), headers: { 'Accept': 'application/json' } });
          if (res.ok) { pcForm.style.display = 'none'; document.getElementById('pcSent').style.display = 'block'; if (pcCharCount) pcCharCount.style.display = 'none'; }
          else { btn.disabled = false; btn.textContent = 'Try Again →'; }
        } catch { btn.disabled = false; btn.textContent = 'Try Again →'; }
      });
    }

    document.addEventListener('contextmenu', e => { if (e.target.tagName === 'IMG') e.preventDefault(); });
    document.addEventListener('dragstart', e => { if (e.target.tagName === 'IMG') e.preventDefault(); });
  </script>
</body>
</html>
