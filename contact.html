<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — 6rac13</title>
  <link rel="icon" href="assets/g-logo.png">
  <style>
    @font-face {
      font-family: 'Amoresa Aged';
      src: url('assets/fonts/AmorosaAged.otf') format('opentype');
      font-weight: normal; font-style: normal;
    }
    @font-face {
      font-family: 'Coco Gothic';
      src: url('assets/fonts/CocoGothic.ttf') format('truetype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Coco Gothic';
      src: url('assets/fonts/CocoGothic-Bold.ttf') format('truetype');
      font-weight: 700;
    }
    @font-face {
      font-family: 'Coco Gothic';
      src: url('assets/fonts/CocoGothic-Light.ttf') format('truetype');
      font-weight: 300;
    }
    :root {
      --blue:   #1C1CCC;
      --yellow: #F2C800;
      --dark:   #28283A;
      --red:    #CC1818;
      --cream:  #F0E4C4;
      --nav-h:  80px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--blue);
      color: var(--yellow);
      font-family: 'Coco Gothic', sans-serif;
      min-height: 100vh;
    }

    /* ── NAV ─────────────────────────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0; z-index: 200;
      height: var(--nav-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px;
      background: var(--blue);
      transition: box-shadow 0.3s;
    }

    nav.scrolled { box-shadow: 0 1px 0 rgba(242,200,0,0.12); }

    .nav-logo { display: flex; align-items: center; text-decoration: none; }
    .nav-logo img { height: 62px; width: auto; object-fit: contain; display: block; }

    .nav-links { display: flex; gap: 52px; list-style: none; }
    .nav-links a {
      color: var(--yellow); text-decoration: none;
      font-family: 'Coco Gothic', sans-serif; font-weight: 700;
      font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .nav-links a:hover { opacity: 0.6; }
    .nav-links a.active { border-bottom: 1px solid var(--yellow); }

    .nav-dropdown-wrap { position: relative; }
    .dropdown-toggle { cursor: pointer; background: none; border: none; padding: 0; }
    .nav-dropdown {
      position: absolute; top: calc(100% + 12px); left: -16px;
      background: var(--blue); border: 1px solid rgba(242,200,0,0.25);
      min-width: 160px; display: none; flex-direction: column; z-index: 300;
    }
    .nav-dropdown-wrap.open .nav-dropdown { display: flex; }
    .nav-dropdown a {
      padding: 12px 20px; color: rgba(242,200,0,0.75); text-decoration: none;
      font-family: 'Coco Gothic', sans-serif; font-weight: 600; font-size: 11px;
      letter-spacing: 0.14em; text-transform: uppercase; transition: color 0.15s;
      border-left: 2px solid transparent;
    }
    .nav-dropdown a:hover { color: var(--yellow); border-left-color: var(--yellow); background: rgba(242,200,0,0.04); }

    /* ── PAGE HEADER ─────────────────────────────────────────────────── */
    .page-header {
      padding: calc(var(--nav-h) + 48px) 28px 0;
      min-height: 38vh;
      display: flex; flex-direction: column; justify-content: flex-end;
    }

    .header-label {
      font-family: 'Coco Gothic', sans-serif; font-weight: 600;
      font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(242,200,0,0.4); margin-bottom: 12px;
    }

    .header-title {
      font-family: 'Amoresa Aged', cursive;
      font-size: clamp(72px, 13vw, 160px);
      color: var(--yellow); line-height: 0.85; margin-bottom: 48px;
    }

    /* ── CONTACT GRID ────────────────────────────────────────────────── */
    .contact-section {
      padding: 0 28px 80px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      border-top: 1px solid rgba(242,200,0,0.12);
      padding-top: 48px;
    }

    /* left: info */
    .contact-info h2 {
      font-family: 'Amoresa Aged', cursive;
      font-size: clamp(36px, 5vw, 56px);
      color: var(--yellow);
      margin-bottom: 28px;
      line-height: 1;
    }

    .contact-link {
      display: block;
      font-family: 'Coco Gothic', sans-serif; font-weight: 300;
      font-size: 14px; color: rgba(242,200,0,0.7);
      text-decoration: none; line-height: 2.4;
      letter-spacing: 0.02em;
      transition: color 0.2s;
    }

    .contact-link:hover { color: var(--yellow); }

    .contact-link-label {
      font-family: 'Coco Gothic', sans-serif; font-weight: 600;
      font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(242,200,0,0.35);
      margin-top: 20px; margin-bottom: 4px;
      display: block;
    }

    /* right: form */
    .contact-form { display: flex; flex-direction: column; gap: 20px; }

    .field-wrap { display: flex; flex-direction: column; gap: 6px; }

    .field-wrap label {
      font-family: 'Coco Gothic', sans-serif; font-weight: 600;
      font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(242,200,0,0.4);
    }

    .field-wrap input,
    .field-wrap textarea {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(242,200,0,0.2);
      color: var(--yellow);
      font-family: 'Coco Gothic', sans-serif; font-weight: 300;
      font-size: 14px; padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
      width: 100%;
    }

    .field-wrap input:focus,
    .field-wrap textarea:focus {
      border-color: rgba(242,200,0,0.6);
    }

    .field-wrap input::placeholder,
    .field-wrap textarea::placeholder {
      color: rgba(242,200,0,0.2);
    }

    .submit-btn {
      background: var(--yellow);
      color: var(--blue);
      border: none; cursor: pointer;
      font-family: 'Coco Gothic', sans-serif; font-weight: 700;
      font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
      padding: 16px 32px;
      align-self: flex-start;
      transition: opacity 0.2s;
    }

    .submit-btn:hover { opacity: 0.85; }
    .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .form-success {
      display: none;
      font-family: 'Coco Gothic', sans-serif; font-weight: 300;
      font-size: 14px; color: rgba(242,200,0,0.7);
      padding: 16px; border: 1px solid rgba(242,200,0,0.2);
    }

    /* ── POSTCARD FOOTER ─────────────────────────────────────────────── */
    .postcard-footer { margin: 0 28px 40px; }
    .postcard-img { width: 100%; display: block; }

    /* ── MOBILE ──────────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      .contact-section { grid-template-columns: 1fr; gap: 48px; }
      .nav-links { gap: 20px; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav id="mainNav">
    <a href="index.html" class="nav-logo">
      <img src="assets/g-logo.png" alt="6rac13">
    </a>
    <ul class="nav-links">
      <li class="nav-dropdown-wrap" id="workDropWrap">
        <a href="work.html" class="dropdown-toggle" id="workToggle">Work</a>
        <div class="nav-dropdown">
          <a href="work.html">All Work</a>
          <a href="work.html?filter=art">Art</a>
          <a href="work.html?filter=videoart">Video Art</a>
          <a href="work.html?filter=events">Events</a>
        </div>
      </li>
      <li><a href="contact.html" class="active">Contact</a></li>
      <li><a href="shop.html">Shop</a></li>
    </ul>
  </nav>

  <!-- HEADER -->
  <header class="page-header">
    <p class="header-label">Get in Touch</p>
    <h1 class="header-title">Contact</h1>
  </header>

  <!-- CONTACT -->
  <section class="contact-section">

    <!-- Info -->
    <div class="contact-info">
      <h2>Grace Fairchild Vanderlaan</h2>

      <span class="contact-link-label">Email</span>
      <a class="contact-link" href="mailto:gracefairchildvanderlaan@gmail.com">
        gracefairchildvanderlaan@gmail.com
      </a>

      <span class="contact-link-label">Instagram</span>
      <a class="contact-link" href="https://instagram.com/6rac13" target="_blank" rel="noopener">
        @6rac13
      </a>

      <span class="contact-link-label">Based in</span>
      <span class="contact-link" style="cursor:default">Los Angeles, CA</span>
    </div>

    <!-- Form -->
    <form class="contact-form" id="contactForm"
          action="https://formspree.io/f/mwlpabqv"
          method="POST">
      <div class="field-wrap">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>
      </div>
      <div class="field-wrap">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required>
      </div>
      <div class="field-wrap">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" placeholder="Tell me about your project or commission…" required></textarea>
      </div>
      <button class="submit-btn" type="submit" id="submitBtn">Send Message</button>
      <div class="form-success" id="formSuccess">
        Message sent — I'll be in touch soon.
      </div>
    </form>
  </section>

  <!-- POSTCARD FOOTER -->
  <footer class="postcard-footer">
    <img src="assets/postcard.png" alt="6rac13 Postcard" class="postcard-img">
  </footer>

  <script>
    window.addEventListener('scroll', () => {
      document.getElementById('mainNav').classList.toggle('scrolled', window.scrollY > 10);
    });

    const workWrap = document.getElementById('workDropWrap');
    document.getElementById('workToggle').addEventListener('click', e => { e.preventDefault(); workWrap.classList.toggle('open'); });
    document.addEventListener('click', e => { if (!workWrap.contains(e.target)) workWrap.classList.remove('open'); });

    // Formspree AJAX submit
    const form      = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const successEl = document.getElementById('formSuccess');

    form.addEventListener('submit', async e => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';

      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });

        if (res.ok) {
          form.reset();
          successEl.style.display = 'block';
          submitBtn.style.display = 'none';
        } else {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Try Again';
        }
      } catch {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Try Again';
      }
    });
  </script>
</body>
</html>
